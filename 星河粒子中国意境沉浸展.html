<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星河粒子 · 中国意境沉浸展</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Noto Serif SC', 'STSong', serif;
    color: #d4af6a;
    user-select: none;
  }

  #canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    cursor: crosshair;
  }

  .overlay {
    position: fixed;
    z-index: 10;
    pointer-events: none;
  }

  .title-section {
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .main-title {
    font-family: 'Ma Shan Zheng', 'STKaiti', serif;
    font-size: 48px;
    font-weight: 400;
    background: linear-gradient(180deg, #f4d77e 0%, #d4af6a 50%, #8b6929 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 8px;
    text-shadow: 0 0 40px rgba(212, 175, 106, 0.3);
    animation: titleGlow 4s ease-in-out infinite alternate;
  }

  .sub-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 16px;
    color: #9a8560;
    letter-spacing: 4px;
    margin-top: 12px;
    opacity: 0.85;
  }

  @keyframes titleGlow {
    from { text-shadow: 0 0 40px rgba(212, 175, 106, 0.2); }
    to { text-shadow: 0 0 80px rgba(212, 175, 106, 0.6), 0 0 120px rgba(212, 175, 106, 0.2); }
  }

  .scene-panel {
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    pointer-events: auto;
    background: rgba(15, 10, 5, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(212, 175, 106, 0.3);
    border-radius: 999px;
    padding: 10px 16px;
  }

  .scene-btn {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 15px;
    color: #8a7a5c;
    background: transparent;
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .scene-btn:hover {
    color: #f4d77e;
  }

  .scene-btn.active {
    color: #0a0705;
    background: linear-gradient(180deg, #f4d77e, #d4af6a);
    box-shadow: 0 0 30px rgba(212, 175, 106, 0.5);
  }

  .poem-display {
    top: 50%;
    right: 60px;
    transform: translateY(-50%);
    text-align: right;
    max-width: 140px;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  .poem-display.show {
    opacity: 1;
  }

  .poem-text {
    font-family: 'Ma Shan Zheng', 'STKaiti', serif;
    font-size: 32px;
    line-height: 1.8;
    color: #e8cf8f;
    writing-mode: vertical-rl;
    -webkit-writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 10px;
    text-shadow: 0 0 30px rgba(232, 207, 143, 0.4);
  }

  .poem-author {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    color: #8a7a5c;
    margin-top: 20px;
    letter-spacing: 3px;
    text-align: right;
  }

  .scene-info {
    top: 50%;
    left: 60px;
    transform: translateY(-50%);
    max-width: 180px;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  .scene-info.show {
    opacity: 1;
  }

  .info-label {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    color: #8a7a5c;
    letter-spacing: 4px;
    margin-bottom: 10px;
    border-left: 3px solid #d4af6a;
    padding-left: 12px;
  }

  .info-title {
    font-family: 'Ma Shan Zheng', 'STKaiti', serif;
    font-size: 26px;
    color: #f4d77e;
    letter-spacing: 4px;
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .info-desc {
    font-size: 13px;
    color: #a89673;
    line-height: 1.9;
    margin-top: 16px;
    letter-spacing: 1px;
  }

  .hint {
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 12px;
    color: #5a4c2e;
    letter-spacing: 4px;
    text-align: center;
    animation: fadeHint 3s ease-in-out infinite;
  }

  @keyframes fadeHint {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  .corner {
    position: fixed;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(212, 175, 106, 0.35);
    z-index: 10;
    pointer-events: none;
  }

  .corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
  .corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
  .corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

  .progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d4af6a, transparent);
    z-index: 10;
    pointer-events: none;
    transition: width 0.3s ease;
  }

  @media (max-width: 768px) {
    .main-title { font-size: 28px; letter-spacing: 4px; }
    .sub-title { font-size: 12px; }
    .scene-panel { padding: 8px; gap: 2px; bottom: 20px; }
    .scene-btn { font-size: 12px; padding: 8px 10px; letter-spacing: 1px; }
    .poem-display { right: 20px; max-width: 100px; }
    .poem-text { font-size: 22px; letter-spacing: 6px; }
    .scene-info { left: 20px; max-width: 120px; }
    .info-title { font-size: 18px; }
    .info-desc { font-size: 11px; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="overlay title-section">
  <div class="main-title">星河粒子</div>
  <div class="sub-title">中 国 意 境 沉 浸 展</div>
</div>

<div class="overlay scene-info" id="sceneInfo">
  <div class="info-label" id="infoLabel">· 古 画 ·</div>
  <div class="info-title" id="infoTitle">千里江山图</div>
  <div class="info-desc" id="infoDesc">王希孟以千里江山写尽少年意气，青绿山水间，是整个大宋的风华。</div>
</div>

<div class="overlay poem-display" id="poemDisplay">
  <div class="poem-text" id="poemText"></div>
  <div class="poem-author" id="poemAuthor"></div>
</div>

<div class="overlay scene-panel">
  <button class="scene-btn active" data-scene="mountains">古 画</button>
  <button class="scene-btn" data-scene="poetry">诗 词</button>
  <button class="scene-btn" data-scene="opera">戏 曲</button>
  <button class="scene-btn" data-scene="garden">园 林</button>
  <button class="scene-btn" data-scene="calligraphy">书 法</button>
  <button class="scene-btn" data-scene="stars">星 空</button>
</div>

<div class="overlay hint">⟡ 移 动 鼠 标 · 点 击 场 景 · 让 粒 子 为 你 重 塑 意 境 ⟡</div>

<canvas id="shapeCanvas" style="display:none;"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const shapeCanvas = document.getElementById('shapeCanvas');
const shapeCtx = shapeCanvas.getContext('2d', { willReadFrequently: true });

let W, H;
let particles = [];
let mouseX = 0, mouseY = 0;
let targetParticles = [];
let currentScene = 'mountains';
let sceneTransitionProgress = 0;
let isTransitioning = false;
let time = 0;

const scenes = {
  mountains: {
    label: '· 古 画 ·',
    title: '千里江山图',
    desc: '王希孟以千里江山写尽少年意气，青绿山水间，是整个大宋的风华。',
    poem: '咫尺千里\n咫尺万里',
    author: '— 王希孟',
    color: { main: '#4a8f6b', accent: '#f4d77e', glow: '#2d5a4a' },
    type: 'mountains'
  },
  poetry: {
    label: '· 诗 词 ·',
    title: '枫桥夜泊',
    desc: '姑苏城外，寒山寺中，钟声穿过千年的月光，落在旅人的心头。',
    poem: '月落乌啼\n霜满天',
    author: '— 张 继',
    color: { main: '#8b7355', accent: '#e8cf8f', glow: '#4a3f2e' },
    type: 'moonRiver'
  },
  opera: {
    label: '· 戏 曲 ·',
    title: '牡丹亭 · 惊梦',
    desc: '良辰美景奈何天，赏心乐事谁家院。杜丽娘的一梦，是中国最动人的浪漫。',
    poem: '原来姹紫\n嫣红开遍',
    author: '— 汤显祖',
    color: { main: '#c96a7e', accent: '#f4d77e', glow: '#6b2e3d' },
    type: 'flower'
  },
  garden: {
    label: '· 园 林 ·',
    title: '苏州园林',
    desc: '亭台楼阁间，一窗一画；曲水流觞处，一步一景。是中国人造在人间的天堂。',
    poem: '虽由人作\n宛自天开',
    author: '— 计 成',
    color: { main: '#6b8e6b', accent: '#d4af6a', glow: '#3a5a3a' },
    type: 'pavilion'
  },
  calligraphy: {
    label: '· 书 法 ·',
    title: '兰亭集序',
    desc: '王羲之醉笔之下，天下第一行书就此诞生。一笔一画，是魏晋风度，是中国人的精神。',
    poem: '仰观宇宙\n之大',
    author: '— 王羲之',
    color: { main: '#2a2a2a', accent: '#f4d77e', glow: '#1a1a1a' },
    type: 'character'
  },
  stars: {
    label: '· 星 空 ·',
    title: '二十八星宿',
    desc: '古人仰观天象，把满天繁星分成二十八宿。紫微垣中，藏着整个宇宙的秩序。',
    poem: '星垂平野\n阔',
    author: '— 杜 甫',
    color: { main: '#5a7ac9', accent: '#e8d8a8', glow: '#2e3f6b' },
    type: 'stars'
  }
};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initParticles();
  generateTargetPositions();
}

window.addEventListener('resize', resize);

class Particle {
  constructor(x, y, tx, ty) {
    this.x = x;
    this.y = y;
    this.tx = tx;
    this.ty = ty;
    this.ox = x;
    this.oy = y;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.size = Math.random() * 1.5 + 0.3;
    this.baseSize = this.size;
    this.life = Math.random() * 100;
    this.maxLife = 200 + Math.random() * 200;
    this.friction = 0.92 + Math.random() * 0.05;
    this.hue = Math.random() * 30;
    this.alpha = 0;
    this.targetAlpha = 0.6 + Math.random() * 0.4;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.01 + Math.random() * 0.02;
    this.id = Math.random();
  }

  update(mouseDisturb) {
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0.5) {
      const force = dist * 0.02;
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force;
    }

    if (mouseDisturb > 0) {
      const mdx = this.x - mouseX;
      const mdy = this.y - mouseY;
      const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mdist < 150 && mdist > 0) {
        const force = (150 - mdist) * 0.3;
        this.vx += (mdx / mdist) * force * 0.05;
        this.vy += (mdy / mdist) * force * 0.05;
      }
    }

    this.wobble += this.wobbleSpeed;
    this.vx += Math.sin(this.wobble) * 0.03;
    this.vy += Math.cos(this.wobble * 0.7) * 0.03;

    this.vx *= this.friction;
    this.vy *= this.friction;

    this.x += this.vx;
    this.y += this.vy;

    if (dist < 20) {
      this.alpha += (this.targetAlpha - this.alpha) * 0.05;
    } else if (dist < 100) {
      this.alpha += ((this.targetAlpha * 0.7) - this.alpha) * 0.03;
    } else {
      this.alpha += (0.1 - this.alpha) * 0.02;
    }

    this.size = this.baseSize * (0.8 + Math.sin(time * 0.02 + this.wobble) * 0.3);
  }

  draw(ctx, color) {
    const brightness = 1 + Math.sin(this.wobble + time * 0.03) * 0.2;
    ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha)) * brightness;
    
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
    grad.addColorStop(0, color.accent);
    grad.addColorStop(0.3, color.main);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha)) * brightness * 1.2;
    ctx.fillStyle = color.accent;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initParticles() {
  particles = [];
  const count = Math.min(2500, Math.floor((W * H) / 800));
  for (let i = 0; i < count; i++) {
    const p = new Particle(
      Math.random() * W,
      Math.random() * H,
      Math.random() * W,
      Math.random() * H
    );
    particles.push(p);
  }
}

function generateShapePoints(type, count) {
  const points = [];
  const cx = W / 2;
  const cy = H / 2;
  const scale = Math.min(W, H) * 0.35;

  if (type === 'mountains') {
    for (let i = 0; i < count; i++) {
      const t = i / count;
      const x = t * W * 0.9 + W * 0.05;
      const baseY = H * 0.65;
      const layer1 = Math.sin(t * Math.PI * 3) * scale * 0.5 + scale * 0.3;
      const layer2 = Math.sin(t * Math.PI * 5 + 1) * scale * 0.3;
      const layer3 = Math.sin(t * Math.PI * 8 + 2) * scale * 0.2;
      const y = baseY - layer1 - layer2 - layer3 + (Math.random() - 0.5) * 8;
      points.push({ x, y: y + (Math.random() - 0.5) * 20 });
    }
    for (let i = 0; i < count * 0.3; i++) {
      const x = Math.random() * W;
      const y = H * 0.25 + Math.random() * H * 0.15;
      points.push({ x, y: y + Math.sin(x * 0.01) * 30 });
    }
  } else if (type === 'moonRiver') {
    for (let i = 0; i < count * 0.3; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = scale * 0.35 + (Math.random() - 0.5) * 10;
      points.push({
        x: cx - scale * 0.4 + Math.cos(angle) * r,
        y: cy - scale * 0.2 + Math.sin(angle) * r
      });
    }
    for (let i = 0; i < count * 0.6; i++) {
      const t = i / (count * 0.6);
      const x = t * W;
      const waveY = cy + scale * 0.3 + Math.sin(t * Math.PI * 4 + time * 0.01) * 15;
      for (let j = 0; j < 3; j++) {
        points.push({
          x: x + (Math.random() - 0.5) * 30,
          y: waveY + (Math.random() - 0.5) * 20 + j * 20
        });
      }
    }
    for (let i = 0; i < count * 0.1; i++) {
      points.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.4
      });
    }
  } else if (type === 'flower') {
    const petals = 6;
    for (let i = 0; i < count; i++) {
      const petalIdx = Math.floor(Math.random() * petals);
      const angle = (petalIdx / petals) * Math.PI * 2 - Math.PI / 2;
      const petalLength = scale * (0.6 + Math.random() * 0.4);
      const petalWidth = scale * 0.25 * (0.5 + Math.random() * 0.5);
      const t = Math.random();
      const localAngle = angle + (Math.random() - 0.5) * 0.6;
      const dist = t * petalLength;
      const widthOffset = (Math.random() - 0.5) * petalWidth * (1 - t);
      points.push({
        x: cx + Math.cos(localAngle) * dist + Math.cos(angle + Math.PI / 2) * widthOffset,
        y: cy + Math.sin(localAngle) * dist + Math.sin(angle + Math.PI / 2) * widthOffset
      });
    }
    for (let i = 0; i < count * 0.1; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * scale * 0.15;
      points.push({
        x: cx + Math.cos(angle) * r,
        y: cy + Math.sin(angle) * r
      });
    }
  } else if (type === 'pavilion') {
    for (let i = 0; i < count; i++) {
      const rand = Math.random();
      if (rand < 0.3) {
        const roofT = Math.random();
        const roofWidth = scale * 1.5;
        const roofHeight = scale * 0.25;
        const x = cx - roofWidth / 2 + roofT * roofWidth;
        const y = cy - scale * 0.1 - Math.sin(roofT * Math.PI) * roofHeight;
        points.push({ x: x + (Math.random() - 0.5) * 8, y: y + (Math.random() - 0.5) * 8 });
      } else if (rand < 0.5) {
        const x = cx + (Math.random() - 0.5) * scale * 1.3;
        const y = cy + (Math.random() - 0.5) * scale * 0.4 + scale * 0.05;
        points.push({ x, y: y + (Math.random() - 0.5) * 5 });
      } else if (rand < 0.65) {
        const pillarIdx = Math.floor(Math.random() * 4);
        const x = cx - scale * 0.5 + pillarIdx * scale * 0.33;
        const y = cy - scale * 0.05 + Math.random() * scale * 0.5;
        points.push({ x: x + (Math.random() - 0.5) * 4, y });
      } else if (rand < 0.8) {
        const archT = Math.random() * Math.PI;
        const r = scale * 0.4;
        points.push({
          x: cx + Math.cos(Math.PI + archT) * r,
          y: cy + scale * 0.2 + Math.sin(Math.PI + archT) * r * 0.5
        });
      } else {
        points.push({
          x: cx + (Math.random() - 0.5) * scale * 1.8,
          y: cy + scale * 0.6 + (Math.random() - 0.5) * scale * 0.3
        });
      }
    }
  } else if (type === 'character') {
    shapeCanvas.width = W;
    shapeCanvas.height = H;
    shapeCtx.clearRect(0, 0, W, H);
    shapeCtx.fillStyle = '#000';
    shapeCtx.fillRect(0, 0, W, H);
    shapeCtx.fillStyle = '#fff';
    shapeCtx.font = `bold ${Math.min(W, H) * 0.55}px 'STKaiti', 'KaiTi', serif`;
    shapeCtx.textAlign = 'center';
    shapeCtx.textBaseline = 'middle';
    const chars = ['梦', '静', '和', '禅', '道', '龙'];
    const char = chars[Math.floor(time * 0.001) % chars.length];
    shapeCtx.fillText(char, cx, cy);

    const imageData = shapeCtx.getImageData(0, 0, W, H).data;
    const samplePoints = [];
    const step = 6;
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const idx = (y * W + x) * 4;
        if (imageData[idx] > 128) {
          samplePoints.push({ x, y });
        }
      }
    }
    for (let i = 0; i < count; i++) {
      if (samplePoints.length > 0) {
        const pt = samplePoints[Math.floor(Math.random() * samplePoints.length)];
        points.push({
          x: pt.x + (Math.random() - 0.5) * 4,
          y: pt.y + (Math.random() - 0.5) * 4
        });
      }
    }
  } else if (type === 'stars') {
    for (let i = 0; i < count * 0.4; i++) {
      points.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.7
      });
    }
    const constellations = [
      { points: [[0.2, 0.3], [0.25, 0.4], [0.35, 0.45], [0.5, 0.5], [0.6, 0.45], [0.7, 0.4], [0.75, 0.35]] },
      { points: [[0.3, 0.55], [0.4, 0.6], [0.5, 0.65], [0.6, 0.6], [0.7, 0.55]] },
      { points: [[0.15, 0.2], [0.3, 0.15], [0.5, 0.12], [0.7, 0.15], [0.85, 0.2]] }
    ];
    for (let c = 0; c < constellations.length; c++) {
      const cp = constellations[c].points;
      for (let j = 0; j < cp.length; j++) {
        for (let k = 0; k < count * 0.02; k++) {
          points.push({
            x: cp[j][0] * W + (Math.random() - 0.5) * 20,
            y: cp[j][1] * H + (Math.random() - 0.5) * 20
          });
        }
      }
    }
    for (let i = 0; i < count * 0.3; i++) {
      const t = Math.random() * Math.PI * 2;
      const r = scale * (0.7 + Math.random() * 0.3);
      points.push({
        x: cx + Math.cos(t) * r * 0.8,
        y: cy + scale * 0.1 + Math.sin(t) * r * 0.3
      });
    }
  }

  return points;
}

function generateTargetPositions() {
  const scene = scenes[currentScene];
  const count = particles.length;
  const points = generateShapePoints(scene.type, count);

  for (let i = 0; i < particles.length; i++) {
    if (points.length > 0) {
      const pt = points[i % points.length];
      particles[i].tx = pt.x;
      particles[i].ty = pt.y;
    }
  }
}

function drawBackgroundGlow() {
  const scene = scenes[currentScene];
  ctx.globalAlpha = 1;
  const gradient = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  gradient.addColorStop(0, scene.color.glow + '40');
  gradient.addColorStop(0.5, scene.color.glow + '15');
  gradient.addColorStop(1, '#000000');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 30; i++) {
    const x = (Math.sin(time * 0.001 + i) * 0.5 + 0.5) * W;
    const y = (Math.cos(time * 0.0015 + i * 2) * 0.5 + 0.5) * H;
    const r = 50 + Math.sin(time * 0.002 + i) * 30;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, scene.color.accent);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawAmbientParticles() {
  const scene = scenes[currentScene];
  ctx.globalAlpha = 0.15;
  for (let i = 0; i < 80; i++) {
    const x = (Math.sin(time * 0.003 + i * 1.7) * 0.5 + 0.5) * W;
    const y = (Math.cos(time * 0.002 + i * 2.3) * 0.5 + 0.5) * H;
    const size = 1 + Math.sin(time * 0.01 + i) * 0.8;
    ctx.fillStyle = scene.color.accent;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function animate() {
  time++;
  ctx.clearRect(0, 0, W, H);
  drawBackgroundGlow();
  drawAmbientParticles();

  const scene = scenes[currentScene];

  for (let i = 0; i < particles.length; i++) {
    particles[i].update(1);
    particles[i].draw(ctx, scene.color);
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
  }
});

canvas.addEventListener('click', (e) => {
  const sceneKeys = Object.keys(scenes);
  const idx = sceneKeys.indexOf(currentScene);
  const nextIdx = (idx + 1) % sceneKeys.length;
  switchScene(sceneKeys[nextIdx]);
});

document.querySelectorAll('.scene-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const sceneKey = btn.dataset.scene;
    switchScene(sceneKey);
  });
});

function switchScene(sceneKey) {
  if (currentScene === sceneKey) return;
  currentScene = sceneKey;

  document.querySelectorAll('.scene-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.scene === sceneKey);
  });

  const scene = scenes[sceneKey];
  const infoEl = document.getElementById('sceneInfo');
  const poemEl = document.getElementById('poemDisplay');

  infoEl.classList.remove('show');
  poemEl.classList.remove('show');

  setTimeout(() => {
    document.getElementById('infoLabel').textContent = scene.label;
    document.getElementById('infoTitle').textContent = scene.title;
    document.getElementById('infoDesc').textContent = scene.desc;
    document.getElementById('poemText').textContent = scene.poem;
    document.getElementById('poemAuthor').textContent = scene.author;
    infoEl.classList.add('show');
    poemEl.classList.add('show');
  }, 600);

  generateTargetPositions();

  for (let i = 0; i < particles.length; i++) {
    const dx = particles[i].tx - particles[i].x;
    const dy = particles[i].ty - particles[i].y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 50) {
      particles[i].x = Math.random() * W;
      particles[i].y = Math.random() * H;
    }
  }
}

resize();

setTimeout(() => {
  document.getElementById('sceneInfo').classList.add('show');
  document.getElementById('poemDisplay').classList.add('show');
}, 1000);

animate();
</script>
</body>
</html>
