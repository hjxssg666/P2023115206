<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星河粒子 · 中国意境沉浸展</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0705;
    font-family: 'Noto Serif SC', 'STSong', serif;
    color: #d4af6a;
    user-select: none;
  }

  #bgCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  #canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    cursor: crosshair;
  }

  .overlay {
    position: fixed;
    z-index: 10;
    pointer-events: none;
  }

  /* 原画展示层 */
  .original-painting {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 70%;
    max-height: 70%;
    z-index: 3;
    opacity: 0.9;
    transition: opacity 2s ease, transform 2s ease;
    pointer-events: none;
    filter: sepia(20%) saturate(1.2) brightness(0.95);
    border: 3px solid rgba(212, 175, 106, 0.4);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(212, 175, 106, 0.1);
  }

  .original-painting.fading {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.1);
  }

  .original-painting.entering {
    animation: enterPainting 2s ease-out forwards;
  }

  @keyframes enterPainting {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    100% { opacity: 0.95; transform: translate(-50%, -50%) scale(1); }
  }

  .title-section {
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .main-title {
    font-family: 'Ma Shan Zheng', 'STKaiti', serif;
    font-size: 52px;
    font-weight: 400;
    background: linear-gradient(180deg, #f4d77e 0%, #d4af6a 50%, #8b6929 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 12px;
    text-shadow: 0 0 40px rgba(212, 175, 106, 0.3);
    animation: titleGlow 4s ease-in-out infinite alternate;
  }

  .sub-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: #9a8560;
    letter-spacing: 6px;
    margin-top: 8px;
    opacity: 0.85;
  }

  @keyframes titleGlow {
    from { text-shadow: 0 0 40px rgba(212, 175, 106, 0.2); }
    to { text-shadow: 0 0 80px rgba(212, 175, 106, 0.6), 0 0 120px rgba(212, 175, 106, 0.2); }
  }

  /* 场景选择面板 */
  .scene-panel {
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    pointer-events: auto;
    background: rgba(15, 10, 5, 0.7);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(212, 175, 106, 0.25);
    border-radius: 999px;
    padding: 8px 14px;
  }

  .scene-btn {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: #8a7a5c;
    background: transparent;
    border: none;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .scene-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: radial-gradient(circle, rgba(244, 215, 126, 0.3) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    transition: width 0.5s, height 0.5s;
    border-radius: 50%;
  }

  .scene-btn:hover::before {
    width: 150px;
    height: 150px;
  }

  .scene-btn:hover {
    color: #f4d77e;
  }

  .scene-btn.active {
    color: #0a0705;
    background: linear-gradient(180deg, #f4d77e, #d4af6a);
    box-shadow: 0 0 30px rgba(212, 175, 106, 0.5);
  }

  /* 诗句展示 */
  .poem-display {
    top: 50%;
    right: 80px;
    transform: translateY(-50%);
    text-align: right;
    max-width: 160px;
    opacity: 0;
    transition: opacity 1.5s ease, transform 1.5s ease;
    transform: translateY(-50%) translateX(30px);
  }

  .poem-display.show {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  .poem-text {
    font-family: 'Ma Shan Zheng', 'STKaiti', serif;
    font-size: 36px;
    line-height: 2;
    color: #e8cf8f;
    writing-mode: vertical-rl;
    -webkit-writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 12px;
    text-shadow: 0 0 30px rgba(232, 207, 143, 0.4);
  }

  .poem-author {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    color: #8a7a5c;
    margin-top: 24px;
    letter-spacing: 4px;
    text-align: right;
  }

  /* 场景信息 */
  .scene-info {
    top: 50%;
    left: 80px;
    transform: translateY(-50%);
    max-width: 220px;
    opacity: 0;
    transition: opacity 1.5s ease, transform 1.5s ease;
    transform: translateY(-50%) translateX(-30px);
  }

  .scene-info.show {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  .info-label {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 12px;
    color: #8a7a5c;
    letter-spacing: 4px;
    margin-bottom: 12px;
    border-left: 3px solid #d4af6a;
    padding-left: 14px;
  }

  .info-title {
    font-family: 'Ma Shan Zheng', 'STKaiti', serif;
    font-size: 32px;
    color: #f4d77e;
    letter-spacing: 6px;
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .info-desc {
    font-size: 14px;
    color: #a89673;
    line-height: 2;
    margin-top: 20px;
    letter-spacing: 1px;
  }

  /* 交互提示 */
  .hint {
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 11px;
    color: #5a4c2e;
    letter-spacing: 4px;
    text-align: center;
    animation: fadeHint 3s ease-in-out infinite;
    white-space: nowrap;
  }

  @keyframes fadeHint {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  /* 进入场景按钮 */
  .enter-btn {
    position: fixed;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    color: #d4af6a;
    background: rgba(15, 10, 5, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(212, 175, 106, 0.3);
    padding: 12px 28px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 4px;
    transition: all 0.4s ease;
    opacity: 0;
    pointer-events: none;
    animation: fadeInUp 1s ease 1.5s forwards;
  }

  .enter-btn:hover {
    background: rgba(212, 175, 106, 0.2);
    border-color: #d4af6a;
    transform: translateX(-50%) scale(1.05);
    box-shadow: 0 0 30px rgba(212, 175, 106, 0.3);
  }

  .enter-btn.hidden {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* 装饰角标 */
  .corner {
    position: fixed;
    width: 50px;
    height: 50px;
    border: 1px solid rgba(212, 175, 106, 0.3);
    z-index: 10;
    pointer-events: none;
  }

  .corner.tl { top: 25px; left: 25px; border-right: none; border-bottom: none; }
  .corner.tr { top: 25px; right: 25px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 25px; left: 25px; border-right: none; border-top: none; }
  .corner.br { bottom: 25px; right: 25px; border-left: none; border-top: none; }

  /* 进度条 */
  .progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d4af6a, transparent);
    z-index: 10;
    pointer-events: none;
    transition: width 0.3s ease;
  }

  /* 氛围效果层 */
  .ambience-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
  }

  /* 加载指示器 */
  .loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: #d4af6a;
    letter-spacing: 4px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* 沉浸模式 */
  .immersive-mode .title-section,
  .immersive-mode .scene-panel,
  .immersive-mode .hint,
  .immersive-mode .scene-info,
  .immersive-mode .poem-display,
  .immersive-mode .corner {
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .immersive-mode:hover .title-section,
  .immersive-mode:hover .scene-panel,
  .immersive-mode:hover .hint,
  .immersive-mode:hover .scene-info,
  .immersive-mode:hover .poem-display,
  .immersive-mode:hover .corner {
    opacity: 1;
  }

  /* 响应式 */
  @media (max-width: 768px) {
    .main-title { font-size: 32px; letter-spacing: 6px; }
    .sub-title { font-size: 11px; letter-spacing: 3px; }
    .scene-panel { padding: 6px 10px; gap: 3px; bottom: 30px; }
    .scene-btn { font-size: 12px; padding: 8px 12px; letter-spacing: 1px; }
    .poem-display { right: 20px; max-width: 100px; }
    .poem-text { font-size: 24px; letter-spacing: 6px; }
    .scene-info { left: 20px; max-width: 140px; }
    .info-title { font-size: 22px; }
    .info-desc { font-size: 11px; }
    .hint { bottom: 120px; font-size: 10px; }
    .enter-btn { bottom: 160px; font-size: 12px; padding: 10px 22px; }
    .corner { width: 30px; height: 30px; }
    .original-painting { max-width: 85%; max-height: 50%; }
  }
</style>
</head>
<body class="immersive-mode">
<div class="loading" id="loading">粒 子 聚 集 中 · · ·</div>

<!-- 原画展示层 (保留元素，用于未来扩展) -->

<!-- 氛围效果层 -->

<div class="corner tl"></div>
<div class="corner tr"></div>

<!-- 场景信息 -->
<div class="overlay scene-info" id="sceneInfo">

  <div class="info-desc" id="infoDesc">王希孟以千里江山写尽少年意气，青绿山水间，是整个大宋的风华。</div>
</div>

<!-- 诗句展示 -->

<div class="overlay hint">⟡ 滚轮缩放 · 双击沉浸 · 拖拽漫游 · 在知识的星空中探索无限可能 ⟡</div>

<!-- 辅助画布 -->
<canvas id="shapeCanvas" style="display:none;"></canvas>

<script>
// ==================== 全局变量 ====================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const shapeCanvas = document.getElementById('shapeCanvas');
const shapeCtx = shapeCanvas.getContext('2d', { willReadFrequently: true });

let W, H;
let particles = [];
let ambientParticles = []; // 氛围粒子
let floatingElements = []; // 飘浮元素
let mouseX = 0, mouseY = 0;
let isMouseMoving = false;
let mouseTimeout;
let currentScene = 'mountains';
let isImmersive = false;
let isPaintingVisible = true;
let paintingRevealProgress = 0;
let sceneTransitionProgress = 0;
let isTransitioning = false;
let time = 0;
let zoom = 1;
let panX = 0, panY = 0;
let isDragging = false;
let lastMouseX, lastMouseY;

// ==================== 场景配置 ====================
const scenes = {
  mountains: {
    label: '· 研 读 ·',
    title: '经典研读',
    desc: '手不释卷，博古通今。每一页文字都是先贤思想的结晶，每一次阅读都是与智者的对话。',
    poem: '学而不厌\n诲人不倦',
    author: '— 论 语',
    color: { main: '#4a8f6b', accent: '#f4d77e', glow: '#2d5a4a', secondary: '#1a3a2a' },
    type: 'bookshelf',
    painting: null,
    ambience: 'mist'
  },
  poetry: {
    label: '· 笔 耕 ·',
    title: '写作创作',
    desc: '笔尖划过纸面，思绪汇成文字。每一个字符都是思维的轨迹，每一篇文章都是灵魂的抒发。',
    poem: '读书破万卷\n下笔如有神',
    author: '— 杜 甫',
    color: { main: '#8b7355', accent: '#e8cf8f', glow: '#4a3f2e', secondary: '#2a2520' },
    type: 'writing',
    painting: null,
    ambience: 'fireflies'
  },
  opera: {
    label: '· 思 索 ·',
    title: '深度思考',
    desc: '静心凝神，思绪万千。让灵感在脑海中碰撞，让创意在沉思中萌发，这是思考者最美的姿态。',
    poem: '学而不思则罔\n思而不学则殆',
    author: '— 孔 子',
    color: { main: '#c96a7e', accent: '#f4d77e', glow: '#6b2e3d', secondary: '#3a1a25' },
    type: 'mindmap',
    painting: null,
    ambience: 'petals'
  },
  garden: {
    label: '· 运 筹 ·',
    title: '规划运筹',
    desc: '运筹帷幄之中，决胜千里之外。清晰的规划是成功的基石，有序的工作是效率的保证。',
    poem: '凡事预则立\n不预则废',
    author: '— 礼 记',
    color: { main: '#6b8e6b', accent: '#d4af6a', glow: '#3a5a3a', secondary: '#1a2a1a' },
    type: 'chart',
    painting: null,
    ambience: 'leaves'
  },
  calligraphy: {
    label: '· 深 耕 ·',
    title: '专注深耕',
    desc: '十年磨一剑，未曾试锋芒。在自己的领域里深耕细作，日复一日的积累终将化为耀眼的成就。',
    poem: '锲而不舍\n金石可镂',
    author: '— 荀 子',
    color: { main: '#d4af6a', accent: '#f4d77e', glow: '#4a3f2e', secondary: '#2a2a1a' },
    type: 'hourglass',
    painting: null,
    ambience: 'ink'
  },
  stars: {
    label: '· 求 索 ·',
    title: '探索研究',
    desc: '路漫漫其修远兮，吾将上下而求索。在知识的星空中探索未知，在研究的道路上不断前行。',
    poem: '路漫漫其修远兮\n吾将上下而求索',
    author: '— 屈 原',
    color: { main: '#5a7ac9', accent: '#e8d8a8', glow: '#2e3f6b', secondary: '#1a1f3a' },
    type: 'explore',
    painting: null,
    ambience: 'stars'
  }
};

// ==================== 粒子类 ====================
class Particle {
  constructor(x, y, tx, ty) {
    this.x = x;
    this.y = y;
    this.tx = tx;
    this.ty = ty;
    this.ox = x;
    this.oy = y;
    this.vx = (Math.random() - 0.5) * 1;
    this.vy = (Math.random() - 0.5) * 1;
    this.size = Math.random() * 2 + 0.5;
    this.baseSize = this.size;
    this.friction = 0.88 + Math.random() * 0.08;
    this.alpha = 0;
    this.targetAlpha = 0.5 + Math.random() * 0.5;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.008 + Math.random() * 0.015;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotationSpeed = (Math.random() - 0.5) * 0.02;
    this.trail = [];
    this.maxTrail = 5;
  }

  update(mouseDisturb, isMouseActive) {
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // 追踪目标
    if (dist > 0.5) {
      const force = dist * 0.015;
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force;
    }

    // 鼠标扰动
    if (mouseDisturb > 0 && isMouseActive) {
      const mdx = this.x - mouseX;
      const mdy = this.y - mouseY;
      const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mdist < 200 && mdist > 0) {
        const force = (200 - mdist) * 0.004;
        this.vx += (mdx / mdist) * force;
        this.vy += (mdy / mdist) * force;
        this.targetAlpha = 0.8 + Math.sin(time * 0.05) * 0.2;
      }
    }

    // 摆动效果
    this.wobble += this.wobbleSpeed;
    this.rotation += this.rotationSpeed;
    this.vx += Math.sin(this.wobble) * 0.02;
    this.vy += Math.cos(this.wobble * 0.7) * 0.02;

    // 阻力
    this.vx *= this.friction;
    this.vy *= this.friction;

    // 更新位置
    this.x += this.vx;
    this.y += this.vy;

    // 拖尾效果
    if (isMouseActive && dist < 50) {
      this.trail.unshift({ x: this.x, y: this.y, alpha: this.alpha });
      if (this.trail.length > this.maxTrail) {
        this.trail.pop();
      }
    }

    // 透明度
    if (dist < 30) {
      this.alpha += (this.targetAlpha - this.alpha) * 0.06;
    } else if (dist < 150) {
      this.alpha += ((this.targetAlpha * 0.6) - this.alpha) * 0.04;
    } else {
      this.alpha += (0.08 - this.alpha) * 0.03;
    }

    // 大小脉动
    this.size = this.baseSize * (0.7 + Math.sin(time * 0.015 + this.wobble) * 0.4);
  }

  draw(ctx, color) {
    const brightness = 0.9 + Math.sin(this.wobble + time * 0.02) * 0.3;

    // 绘制拖尾
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const trailAlpha = (1 - i / this.maxTrail) * 0.3 * this.alpha;
      ctx.globalAlpha = trailAlpha;
      ctx.fillStyle = color.accent;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha)) * brightness;

    // 外发光
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 5);
    grad.addColorStop(0, color.accent);
    grad.addColorStop(0.2, color.main);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 5, 0, Math.PI * 2);
    ctx.fill();

    // 核心
    ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha)) * brightness * 1.3;
    ctx.fillStyle = color.accent;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ==================== 氛围粒子类 ====================
class AmbientParticle {
  constructor(type) {
    this.type = type;
    this.reset();
  }

  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.size = Math.random() * 3 + 1;
    this.alpha = Math.random() * 0.5 + 0.2;
    this.life = 0;
    this.maxLife = 300 + Math.random() * 200;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.01 + Math.random() * 0.02;
  }

  update(sceneColor) {
    this.life++;
    this.wobble += this.wobbleSpeed;

    if (this.type === 'fireflies') {
      this.vx += Math.sin(this.wobble) * 0.02;
      this.vy += Math.cos(this.wobble * 0.8) * 0.02;
      this.alpha = 0.3 + Math.sin(time * 0.05 + this.wobble) * 0.3;
    } else if (this.type === 'mist') {
      this.vy -= 0.1;
      this.alpha = 0.1 + Math.sin(this.wobble) * 0.05;
    } else if (this.type === 'stars') {
      this.alpha = 0.5 + Math.sin(time * 0.03 + this.wobble) * 0.5;
    } else {
      this.vx += (Math.random() - 0.5) * 0.1;
      this.vy += (Math.random() - 0.5) * 0.1;
    }

    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.99;
    this.vy *= 0.99;

    if (this.life > this.maxLife || this.x < 0 || this.x > W || this.y < 0 || this.y > H) {
      this.reset();
    }
  }

  draw(ctx, color) {
    ctx.globalAlpha = this.alpha;

    if (this.type === 'fireflies') {
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 8);
      grad.addColorStop(0, '#ffffaa');
      grad.addColorStop(0.3, color.accent);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 8, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'mist') {
      ctx.fillStyle = `rgba(200, 200, 200, ${this.alpha})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 10, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'stars') {
      ctx.fillStyle = color.accent;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = color.accent;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ==================== 飘浮元素类 ====================
class FloatingElement {
  constructor(type) {
    this.type = type;
    this.reset();
  }

  reset() {
    if (this.type === 'petal') {
      this.x = Math.random() * W;
      this.y = -50;
      this.size = 8 + Math.random() * 12;
      this.vx = (Math.random() - 0.5) * 1;
      this.vy = Math.random() * 1 + 0.5;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.05;
      this.color = ['#ffb6c1', '#ffc0cb', '#ff69b4', '#ff1493'][Math.floor(Math.random() * 4)];
    } else if (this.type === 'leaf') {
      this.x = Math.random() * W;
      this.y = -50;
      this.size = 10 + Math.random() * 15;
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = Math.random() * 0.8 + 0.3;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.03;
      this.color = ['#6b8e6b', '#8fbc8f', '#9acd32', '#556b2f'][Math.floor(Math.random() * 4)];
    } else if (this.type === 'ink') {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.size = 2 + Math.random() * 4;
      this.vx = 0;
      this.vy = -0.2 - Math.random() * 0.3;
      this.alpha = 0.3 + Math.random() * 0.4;
    }

    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.02 + Math.random() * 0.02;
  }

  update() {
    this.wobble += this.wobbleSpeed;

    if (this.type === 'petal' || this.type === 'leaf') {
      this.x += this.vx + Math.sin(this.wobble) * 0.5;
      this.y += this.vy;
      this.rotation += this.rotationSpeed + Math.sin(this.wobble) * 0.01;
      if (this.y > H + 50) this.reset();
    } else if (this.type === 'ink') {
      this.y += this.vy;
      this.x += Math.sin(this.wobble) * 0.3;
      this.alpha -= 0.001;
      if (this.alpha <= 0 || this.y < -20) this.reset();
    }
  }

  draw(ctx) {
    if (this.type === 'petal') {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (this.type === 'leaf') {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.moveTo(0, -this.size);
      ctx.quadraticCurveTo(this.size * 0.8, 0, 0, this.size);
      ctx.quadraticCurveTo(-this.size * 0.8, 0, 0, -this.size);
      ctx.fill();
      ctx.restore();
    } else if (this.type === 'ink') {
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ==================== 初始化 ====================
function resize() {
  W = canvas.width = bgCanvas.width = window.innerWidth;
  H = canvas.height = bgCanvas.height = window.innerHeight;
  initParticles();
  initAmbience();
  generateTargetPositions();
}

window.addEventListener('resize', resize);

function initParticles() {
  particles = [];
  const count = Math.min(8000, Math.floor((W * H) / 400));
  for (let i = 0; i < count; i++) {
    const p = new Particle(
      Math.random() * W,
      Math.random() * H,
      Math.random() * W,
      Math.random() * H
    );
    particles.push(p);
  }
}

function initAmbience() {
  const scene = scenes[currentScene];
  const ambienceType = scene.ambience;

  ambientParticles = [];
  floatingElements = [];

  const ambientCount = 150;
  for (let i = 0; i < ambientCount; i++) {
    ambientParticles.push(new AmbientParticle(ambienceType));
  }

  const floatCount = 30;
  if (ambienceType === 'petals') {
    for (let i = 0; i < floatCount; i++) {
      floatingElements.push(new FloatingElement('petal'));
    }
  } else if (ambienceType === 'leaves') {
    for (let i = 0; i < floatCount; i++) {
      floatingElements.push(new FloatingElement('leaf'));
    }
  } else if (ambienceType === 'ink') {
    for (let i = 0; i < floatCount * 2; i++) {
      floatingElements.push(new FloatingElement('ink'));
    }
  }
}

// ==================== 形状生成 ====================
function generateShapePoints(type, count) {
  const points = [];
  const cx = W / 2 + panX;
  const cy = H / 2 + panY;
  const scale = Math.min(W, H) * 0.4 * zoom;

  if (type === 'bookshelf') {
    // 书架 - 研读场景
    const shelfCount = 4;
    const shelfWidth = scale * 2.5;
    const shelfHeight = scale * 0.15;
    const bookColors = ['#8b4513', '#654321', '#800020', '#2f4f4f', '#483d8b', '#800000', '#556b2f', '#6b4423'];

    for (let shelf = 0; shelf < shelfCount; shelf++) {
      const shelfY = cy - scale * 0.7 + shelf * (scale * 0.45 + shelfHeight);

      // 书架板
      for (let i = 0; i < count * 0.08; i++) {
        const x = cx - shelfWidth / 2 + Math.random() * shelfWidth;
        const y = shelfY + scale * 0.25 + (Math.random() - 0.5) * 5;
        points.push({ x: x + panX, y: y + panY });
      }

      // 书本
      let bookX = cx - shelfWidth / 2 + scale * 0.1;
      while (bookX < cx + shelfWidth / 2 - scale * 0.1) {
        const bookWidth = scale * 0.06 + Math.random() * scale * 0.04;
        const bookHeight = scale * 0.15 + Math.random() * scale * 0.1;
        const bookTopY = shelfY + scale * 0.25 - bookHeight;

        // 书脊
        for (let i = 0; i < count * 0.02; i++) {
          const x = bookX + (Math.random() - 0.5) * bookWidth * 0.8;
          const y = bookTopY + Math.random() * bookHeight;
          points.push({ x: x + panX, y: y + panY });
        }

        // 书页细节
        if (Math.random() > 0.5) {
          for (let i = 0; i < count * 0.01; i++) {
            const x = bookX + bookWidth * 0.3 + (Math.random() - 0.5) * 3;
            const y = bookTopY + Math.random() * bookHeight * 0.8;
            points.push({ x: x + panX, y: y + panY });
          }
        }

        bookX += bookWidth + 2;
      }
    }

    // 散落的文字粒子
    for (let i = 0; i < count * 0.1; i++) {
      points.push({
        x: Math.random() * W + panX,
        y: H * 0.15 + Math.random() * H * 0.7 + panY
      });
    }

  } else if (type === 'writing') {
    // 写作创作 - 文字流
    // 页面框架
    const pageWidth = scale * 1.8;
    const pageHeight = scale * 1.4;
    const pageLeft = cx - pageWidth / 2;
    const pageTop = cy - pageHeight / 2;

    // 页面边缘
    for (let i = 0; i < count * 0.1; i++) {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = pageLeft + (Math.random() - 0.5) * 5; y = pageTop + Math.random() * pageHeight; }
      else if (side === 1) { x = pageLeft + pageWidth + (Math.random() - 0.5) * 5; y = pageTop + Math.random() * pageHeight; }
      else if (side === 2) { x = pageLeft + Math.random() * pageWidth; y = pageTop + (Math.random() - 0.5) * 5; }
      else { x = pageLeft + Math.random() * pageWidth; y = pageTop + pageHeight + (Math.random() - 0.5) * 5; }
      points.push({ x: x + panX, y: y + panY });
    }

    // 文字行
    const lineCount = 10;
    for (let line = 0; line < lineCount; line++) {
      const lineY = pageTop + scale * 0.15 + line * scale * 0.11;
      const lineLength = pageWidth * (0.6 + Math.random() * 0.35);
      const lineLeft = pageLeft + scale * 0.1;

      for (let i = 0; i < count * 0.05; i++) {
        const t = Math.random();
        const x = lineLeft + t * lineLength;
        const y = lineY + Math.sin(t * Math.PI * 8 + line) * 2 + (Math.random() - 0.5) * 4;
        points.push({ x: x + panX, y: y + panY });
      }

      // 标点符号点
      for (let i = 0; i < count * 0.01; i++) {
        points.push({
          x: lineLeft + lineLength + (Math.random() - 0.5) * 10 + panX,
          y: lineY + (Math.random() - 0.5) * 5 + panY
        });
      }
    }

    // 笔尖/光标
    const cursorX = pageLeft + pageWidth * 0.3 + Math.sin(time * 0.02) * scale * 0.1;
    const cursorY = pageTop + pageHeight * 0.7;
    for (let i = 0; i < count * 0.05; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * scale * 0.08;
      points.push({
        x: cursorX + Math.cos(angle) * r + panX,
        y: cursorY + Math.sin(angle) * r + panY
      });
    }

    // 散落的灵感粒子
    for (let i = 0; i < count * 0.15; i++) {
      points.push({
        x: Math.random() * W + panX,
        y: Math.random() * H + panY
      });
    }

  } else if (type === 'mindmap') {
    // 深度思考 - 思维导图
    // 中心节点
    const centerR = scale * 0.2;
    for (let i = 0; i < count * 0.15; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = centerR * (0.7 + Math.random() * 0.3);
      points.push({
        x: cx + Math.cos(angle) * r + panX,
        y: cy + Math.sin(angle) * r + panY
      });
    }

    // 分支节点
    const branchCount = 8;
    for (let b = 0; b < branchCount; b++) {
      const baseAngle = (b / branchCount) * Math.PI * 2 + time * 0.0005;
      const branchDist = scale * 0.5;
      const nodeX = cx + Math.cos(baseAngle) * branchDist;
      const nodeY = cy + Math.sin(baseAngle) * branchDist;

      // 连线
      for (let i = 0; i < count * 0.03; i++) {
        const t = Math.random();
        const wave = Math.sin(t * Math.PI) * scale * 0.1;
        const nx = cx + (nodeX - cx) * t + Math.cos(baseAngle + Math.PI / 2) * wave + (Math.random() - 0.5) * 5;
        const ny = cy + (nodeY - cy) * t + Math.sin(baseAngle + Math.PI / 2) * wave + (Math.random() - 0.5) * 5;
        points.push({ x: nx, y: ny });
      }

      // 子节点
      const nodeSize = scale * 0.1 * (0.5 + Math.random() * 0.5);
      for (let i = 0; i < count * 0.04; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = nodeSize * (0.7 + Math.random() * 0.3);
        points.push({
          x: nodeX + Math.cos(angle) * r + panX,
          y: nodeY + Math.sin(angle) * r + panY
        });
      }

      // 二级分支
      if (b % 2 === 0) {
        const subAngle = baseAngle + (Math.random() - 0.5) * 0.5;
        const subDist = scale * 0.85;
        const subX = cx + Math.cos(subAngle) * subDist;
        const subY = cy + Math.sin(subAngle) * subDist;

        // 二级连线
        for (let i = 0; i < count * 0.02; i++) {
          const t = Math.random();
          points.push({
            x: nodeX + (subX - nodeX) * t + (Math.random() - 0.5) * 5 + panX,
            y: nodeY + (subY - nodeY) * t + (Math.random() - 0.5) * 5 + panY
          });
        }

        // 二级节点
        for (let i = 0; i < count * 0.03; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = scale * 0.07 * (0.7 + Math.random() * 0.3);
          points.push({
            x: subX + Math.cos(angle) * r + panX,
            y: subY + Math.sin(angle) * r + panY
          });
        }
      }
    }

    // 思考光环 - 环绕的粒子
    for (let i = 0; i < count * 0.1; i++) {
      const orbitAngle = Math.random() * Math.PI * 2 + time * 0.002;
      const orbitR = scale * (0.3 + Math.random() * 0.7);
      points.push({
        x: cx + Math.cos(orbitAngle) * orbitR + panX,
        y: cy + Math.sin(orbitAngle) * orbitR + panY
      });
    }

  } else if (type === 'chart') {
    // 规划运筹 - 图表
    // 柱状图
    const barCount = 7;
    const barWidth = scale * 0.15;
    const barGap = scale * 0.1;
    const chartWidth = barCount * barWidth + (barCount - 1) * barGap;
    const chartLeft = cx - chartWidth / 2;
    const chartBottom = cy + scale * 0.4;
    const chartHeight = scale * 1.1;

    // 坐标轴
    for (let i = 0; i < count * 0.08; i++) {
      // X轴
      points.push({
        x: chartLeft + Math.random() * chartWidth + panX,
        y: chartBottom + (Math.random() - 0.5) * 4 + panY
      });
      // Y轴
      points.push({
        x: chartLeft + (Math.random() - 0.5) * 4 + panX,
        y: chartBottom - Math.random() * chartHeight + panY
      });
    }

    // 柱子
    const barHeights = [0.45, 0.7, 0.55, 0.85, 0.65, 0.9, 0.75];
    for (let b = 0; b < barCount; b++) {
      const barLeft = chartLeft + b * (barWidth + barGap);
      const barHeight = chartHeight * barHeights[b];
      const barTop = chartBottom - barHeight;

      for (let i = 0; i < count * 0.08; i++) {
        points.push({
          x: barLeft + Math.random() * barWidth + panX,
          y: barTop + Math.random() * barHeight + panY
        });
      }

      // 柱子顶部标记
      for (let i = 0; i < count * 0.01; i++) {
        points.push({
          x: barLeft + barWidth / 2 + (Math.random() - 0.5) * 15 + panX,
          y: barTop - scale * 0.08 + (Math.random() - 0.5) * 5 + panY
        });
      }
    }

    // 折线图 - 叠加在柱图上方
    for (let i = 0; i < count * 0.1; i++) {
      const t = Math.random();
      const x = chartLeft + t * chartWidth;
      const trendY = chartBottom - chartHeight * (0.55 + Math.sin(t * Math.PI * 3 + time * 0.005) * 0.25);
      points.push({
        x: x + panX,
        y: trendY + (Math.random() - 0.5) * 10 + panY
      });
    }

    // 数据点
    for (let b = 0; b < barCount; b++) {
      const barCenter = chartLeft + b * (barWidth + barGap) + barWidth / 2;
      const dataY = chartBottom - chartHeight * (barHeights[b] + 0.1);
      for (let i = 0; i < count * 0.015; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * scale * 0.04;
        points.push({
          x: barCenter + Math.cos(angle) * r + panX,
          y: dataY + Math.sin(angle) * r + panY
        });
      }
    }

    // 装饰性百分比数字
    for (let i = 0; i < count * 0.05; i++) {
      points.push({
        x: Math.random() * W * 0.6 + W * 0.2 + panX,
        y: H * 0.2 + Math.random() * H * 0.2 + panY
      });
    }

  } else if (type === 'hourglass') {
    // 深耕 - 沙漏与时间
    const hourglassW = scale * 0.5;
    const hourglassH = scale * 1.2;

    // 沙漏外框 - 梯形
    for (let i = 0; i < count * 0.1; i++) {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) {
        // 左边框 - 上半
        const t = Math.random();
        x = cx - hourglassW * (0.3 + t * 0.7);
        y = cy - hourglassH + t * hourglassH + (Math.random() - 0.5) * 4;
      } else if (side === 1) {
        // 左边框 - 下半
        const t = Math.random();
        x = cx - hourglassW * (1 - t * 0.7);
        y = cy + t * hourglassH + (Math.random() - 0.5) * 4;
      } else if (side === 2) {
        // 右边框 - 上半
        const t = Math.random();
        x = cx + hourglassW * (0.3 + t * 0.7);
        y = cy - hourglassH + t * hourglassH + (Math.random() - 0.5) * 4;
      } else {
        // 右边框 - 下半
        const t = Math.random();
        x = cx + hourglassW * (1 - t * 0.7);
        y = cy + t * hourglassH + (Math.random() - 0.5) * 4;
      }
      points.push({ x: x + panX, y: y + panY });
    }

    // 上下顶边
    for (let i = 0; i < count * 0.05; i++) {
      points.push({
        x: cx + (Math.random() - 0.5) * hourglassW * 2.5 + panX,
        y: cy - hourglassH * 1.05 + (Math.random() - 0.5) * 4 + panY
      });
      points.push({
        x: cx + (Math.random() - 0.5) * hourglassW * 2.5 + panX,
        y: cy + hourglassH * 1.05 + (Math.random() - 0.5) * 4 + panY
      });
    }

    // 上半部分沙 - 随时间减少
    const sandProgress = (Math.sin(time * 0.003) * 0.5 + 0.5) * 0.8 + 0.1;
    const sandTop = cy - hourglassH * 0.9;
    const sandBottom = cy - hourglassH * sandProgress * 0.9;

    for (let i = 0; i < count * 0.2; i++) {
      const t = Math.random();
      const y = sandTop + t * (sandBottom - sandTop);
      const normalizedY = (y - sandTop) / (sandBottom - sandTop);
      const currentWidth = hourglassW * (0.9 - normalizedY * 0.6);
      points.push({
        x: cx + (Math.random() - 0.5) * currentWidth * 1.8 + panX,
        y: y + (Math.random() - 0.5) * 3 + panY
      });
    }

    // 下半部分沙 - 随时间增加
    const lowerSandTop = cy + hourglassH * (1 - sandProgress) * 0.9;
    const lowerSandBottom = cy + hourglassH * 0.95;

    for (let i = 0; i < count * 0.2; i++) {
      const t = Math.random();
      const y = lowerSandTop + t * (lowerSandBottom - lowerSandTop);
      const normalizedY = 1 - (y - lowerSandTop) / (lowerSandBottom - lowerSandTop);
      const currentWidth = hourglassW * (0.6 + normalizedY * 1.4);
      points.push({
        x: cx + (Math.random() - 0.5) * currentWidth * 1.5 + panX,
        y: y + (Math.random() - 0.5) * 3 + panY
      });
    }

    // 中间沙漏口 - 下落的沙粒
    for (let i = 0; i < count * 0.08; i++) {
      const x = cx + (Math.random() - 0.5) * scale * 0.05;
      const y = cy + (Math.random() - 0.5) * scale * 0.1;
      points.push({ x: x + panX, y: y + panY });
    }

    // 下落的沙流
    for (let i = 0; i < count * 0.05; i++) {
      const x = cx + (Math.random() - 0.5) * 8;
      const y = cy + (Math.random() - 0.5) * scale * 0.3;
      points.push({ x: x + panX, y: y + panY });
    }

    // 周围的时间标记 - 圆形轨道粒子
    const orbitCount = 3;
    for (let orbit = 0; orbit < orbitCount; orbit++) {
      const orbitR = scale * (0.8 + orbit * 0.25);
      for (let i = 0; i < count * 0.03; i++) {
        const angle = Math.random() * Math.PI * 2 + time * 0.001 * (orbit + 1);
        points.push({
          x: cx + Math.cos(angle) * orbitR + panX,
          y: cy + Math.sin(angle) * orbitR + panY
        });
      }
    }

    // 四周的数字/符号粒子表示进度
    for (let i = 0; i < count * 0.08; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = scale * (1.2 + Math.random() * 0.3);
      points.push({
        x: cx + Math.cos(angle) * r + panX,
        y: cy + Math.sin(angle) * r + panY
      });
    }

  } else if (type === 'explore') {
    // 探索研究 - 知识星空与罗盘
    // 背景知识粒子 - 大量小星星
    for (let i = 0; i < count * 0.4; i++) {
      points.push({
        x: Math.random() * W + panX,
        y: Math.random() * H * 0.9 + panY
      });
    }

    // 中心罗盘
    const compassR = scale * 0.3;
    for (let i = 0; i < count * 0.08; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = compassR * (0.9 + Math.random() * 0.1);
      points.push({
        x: cx + Math.cos(angle) * r + panX,
        y: cy + Math.sin(angle) * r + panY
      });
    }

    // 罗盘指针
    for (let i = 0; i < count * 0.05; i++) {
      const pointerAngle = time * 0.002;
      const t = Math.random();
      const r = compassR * t;
      if (Math.random() > 0.3) {
        points.push({
          x: cx + Math.cos(pointerAngle) * r + panX,
          y: cy + Math.sin(pointerAngle) * r + panY
        });
      } else {
        points.push({
          x: cx - Math.cos(pointerAngle) * r + panX,
          y: cy - Math.sin(pointerAngle) * r + panY
        });
      }
    }

    // 罗盘刻度
    for (let a = 0; a < 12; a++) {
      const angle = (a / 12) * Math.PI * 2;
      const r1 = compassR * 1.1;
      const r2 = compassR * 1.25;
      for (let i = 0; i < count * 0.008; i++) {
        const t = Math.random();
        points.push({
          x: cx + Math.cos(angle) * (r1 + (r2 - r1) * t) + panX,
          y: cy + Math.sin(angle) * (r1 + (r2 - r1) * t) + panY
        });
      }
    }

    // 知识节点 - 围绕罗盘分布的主题
    const topicCount = 6;
    for (let t = 0; t < topicCount; t++) {
      const topicAngle = (t / topicCount) * Math.PI * 2 + time * 0.0008;
      const topicDist = scale * 0.75;
      const topicX = cx + Math.cos(topicAngle) * topicDist;
      const topicY = cy + Math.sin(topicAngle) * topicDist;

      // 连接线
      for (let i = 0; i < count * 0.02; i++) {
        const progress = Math.random();
        points.push({
          x: cx + (topicX - cx) * progress + (Math.random() - 0.5) * 8 + panX,
          y: cy + (topicY - cy) * progress + (Math.random() - 0.5) * 8 + panY
        });
      }

      // 主题节点
      const nodeSize = scale * 0.1;
      for (let i = 0; i < count * 0.03; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = nodeSize * (0.6 + Math.random() * 0.4);
        points.push({
          x: topicX + Math.cos(angle) * r + panX,
          y: topicY + Math.sin(angle) * r + panY
        });
      }
    }

    // 向外延伸的探索路径 - 螺旋轨迹
    for (let i = 0; i < count * 0.1; i++) {
      const t = Math.random();
      const spiralAngle = t * Math.PI * 4 + time * 0.001;
      const spiralR = scale * (0.3 + t * 0.8);
      points.push({
        x: cx + Math.cos(spiralAngle) * spiralR + (Math.random() - 0.5) * 15 + panX,
        y: cy + Math.sin(spiralAngle) * spiralR + (Math.random() - 0.5) * 15 + panY
      });
    }
  }

  return points;
}

function generateTargetPositions() {
  const scene = scenes[currentScene];
  const count = particles.length;
  const points = generateShapePoints(scene.type, count);

  for (let i = 0; i < particles.length; i++) {
    if (points.length > 0) {
      const pt = points[i % points.length];
      particles[i].tx = pt.x;
      particles[i].ty = pt.y;
    }
  }
}

// ==================== 绘制函数 ====================
function drawBackgroundGlow() {
  const scene = scenes[currentScene];
  bgCtx.globalAlpha = 1;

  // 渐变背景
  const gradient = bgCtx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.8);
  gradient.addColorStop(0, scene.color.glow + '50');
  gradient.addColorStop(0.4, scene.color.secondary + '40');
  gradient.addColorStop(0.7, scene.color.glow + '20');
  gradient.addColorStop(1, '#000000');
  bgCtx.fillStyle = gradient;
  bgCtx.fillRect(0, 0, W, H);

  // 动态光晕
  bgCtx.globalAlpha = 0.06;
  for (let i = 0; i < 20; i++) {
    const x = (Math.sin(time * 0.0008 + i) * 0.4 + 0.5) * W;
    const y = (Math.cos(time * 0.001 + i * 2) * 0.4 + 0.5) * H;
    const r = 80 + Math.sin(time * 0.002 + i) * 40;
    const g = bgCtx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, scene.color.accent);
    g.addColorStop(1, 'transparent');
    bgCtx.fillStyle = g;
    bgCtx.beginPath();
    bgCtx.arc(x, y, r, 0, Math.PI * 2);
    bgCtx.fill();
  }
}

function drawAmbience() {
  const scene = scenes[currentScene];

  for (const p of ambientParticles) {
    p.update(scene.color);
    p.draw(ctx, scene.color);
  }

  for (const f of floatingElements) {
    f.update();
    f.draw(ctx);
  }
}

function animate() {
  time++;

  ctx.clearRect(0, 0, W, H);
  bgCtx.clearRect(0, 0, W, H);

  drawBackgroundGlow();

  const scene = scenes[currentScene];

  for (let i = 0; i < particles.length; i++) {
    particles[i].update(1, isMouseMoving);
    particles[i].draw(ctx, scene.color);
  }

  drawAmbience();

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

// ==================== 交互 ====================
canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  isMouseMoving = true;

  clearTimeout(mouseTimeout);
  mouseTimeout = setTimeout(() => {
    isMouseMoving = false;
  }, 100);

  if (isDragging) {
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    panX += dx;
    panY += dy;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    generateTargetPositions();
  }
});

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('mouseup', () => {
  isDragging = false;
  canvas.style.cursor = 'crosshair';
});

canvas.addEventListener('mouseleave', () => {
  isDragging = false;
  canvas.style.cursor = 'crosshair';
});

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    isMouseMoving = true;
  }
});

canvas.addEventListener('click', (e) => {
  const sceneKeys = Object.keys(scenes);
  const idx = sceneKeys.indexOf(currentScene);
  const nextIdx = (idx + 1) % sceneKeys.length;
  switchScene(sceneKeys[nextIdx]);
});

canvas.addEventListener('dblclick', (e) => {
  enterImmersive();
});

// 滚轮缩放
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.95 : 1.05;
  zoom = Math.max(0.5, Math.min(2, zoom * delta));
  generateTargetPositions();
});

// 场景切换
document.querySelectorAll('.scene-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const sceneKey = btn.dataset.scene;
    switchScene(sceneKey);
  });
});

function switchScene(sceneKey) {
  if (currentScene === sceneKey) return;
  currentScene = sceneKey;

  document.querySelectorAll('.scene-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.scene === sceneKey);
  });

  const scene = scenes[sceneKey];

  // 更新信息
  const infoEl = document.getElementById('sceneInfo');
  const poemEl = document.getElementById('poemDisplay');

  infoEl.classList.remove('show');
  poemEl.classList.remove('show');

  setTimeout(() => {
    document.getElementById('infoLabel').textContent = scene.label;
    document.getElementById('infoTitle').textContent = scene.title;
    document.getElementById('infoDesc').textContent = scene.desc;
    document.getElementById('poemText').textContent = scene.poem;
    document.getElementById('poemAuthor').textContent = scene.author;
    infoEl.classList.add('show');
    poemEl.classList.add('show');
  }, 600);

  // 重置视角
  zoom = 1;
  panX = 0;
  panY = 0;

  // 重新初始化氛围
  initAmbience();
  generateTargetPositions();

  // 散开粒子
  for (let i = 0; i < particles.length; i++) {
    const dx = particles[i].tx - particles[i].x;
    const dy = particles[i].ty - particles[i].y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 50) {
      particles[i].x = Math.random() * W;
      particles[i].y = Math.random() * H;
    }
  }
}

function enterImmersive() {
  isImmersive = !isImmersive;
  const btn = document.getElementById('enterBtn');

  if (isImmersive) {
    document.body.classList.add('immersive-mode');
    btn.textContent = '⟡ 退 出 沉 浸 ⟡';
  } else {
    document.body.classList.remove('immersive-mode');
    btn.textContent = '⟡ 进 入 学 习 ⟡';
  }
}

document.getElementById('enterBtn').addEventListener('click', enterImmersive);

// ==================== 启动 ====================
resize();

setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('sceneInfo').classList.add('show');
  document.getElementById('poemDisplay').classList.add('show');
}, 1500);

animate();
</script>
