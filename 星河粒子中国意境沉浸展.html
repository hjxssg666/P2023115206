<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星河粒子 · 中国意境沉浸展</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0705;
    font-family: 'Noto Serif SC', 'STSong', serif;
    color: #d4af6a;
    user-select: none;
  }

  #bgCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  #canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    cursor: crosshair;
  }

  .overlay {
    position: fixed;
    z-index: 10;
    pointer-events: none;
  }

  /* 原画展示层 */
  .original-painting {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 70%;
    max-height: 70%;
    z-index: 3;
    opacity: 0.9;
    transition: opacity 2s ease, transform 2s ease;
    pointer-events: none;
    filter: sepia(20%) saturate(1.2) brightness(0.95);
    border: 3px solid rgba(212, 175, 106, 0.4);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(212, 175, 106, 0.1);
  }

  .original-painting.fading {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.1);
  }

  .original-painting.entering {
    animation: enterPainting 2s ease-out forwards;
  }

  @keyframes enterPainting {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    100% { opacity: 0.95; transform: translate(-50%, -50%) scale(1); }
  }

  .title-section {
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .main-title {
    font-family: 'Ma Shan Zheng', 'STKaiti', serif;
    font-size: 52px;
    font-weight: 400;
    background: linear-gradient(180deg, #f4d77e 0%, #d4af6a 50%, #8b6929 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 12px;
    text-shadow: 0 0 40px rgba(212, 175, 106, 0.3);
    animation: titleGlow 4s ease-in-out infinite alternate;
  }

  .sub-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: #9a8560;
    letter-spacing: 6px;
    margin-top: 8px;
    opacity: 0.85;
  }

  @keyframes titleGlow {
    from { text-shadow: 0 0 40px rgba(212, 175, 106, 0.2); }
    to { text-shadow: 0 0 80px rgba(212, 175, 106, 0.6), 0 0 120px rgba(212, 175, 106, 0.2); }
  }

  /* 场景选择面板 */
  .scene-panel {
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    pointer-events: auto;
    background: rgba(15, 10, 5, 0.7);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(212, 175, 106, 0.25);
    border-radius: 999px;
    padding: 8px 14px;
  }

  .scene-btn {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: #8a7a5c;
    background: transparent;
    border: none;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .scene-btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: radial-gradient(circle, rgba(244, 215, 126, 0.3) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    transition: width 0.5s, height 0.5s;
    border-radius: 50%;
  }

  .scene-btn:hover::before {
    width: 150px;
    height: 150px;
  }

  .scene-btn:hover {
    color: #f4d77e;
  }

  .scene-btn.active {
    color: #0a0705;
    background: linear-gradient(180deg, #f4d77e, #d4af6a);
    box-shadow: 0 0 30px rgba(212, 175, 106, 0.5);
  }

  /* 诗句展示 */
  .poem-display {
    top: 50%;
    right: 80px;
    transform: translateY(-50%);
    text-align: right;
    max-width: 160px;
    opacity: 0;
    transition: opacity 1.5s ease, transform 1.5s ease;
    transform: translateY(-50%) translateX(30px);
  }

  .poem-display.show {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  .poem-text {
    font-family: 'Ma Shan Zheng', 'STKaiti', serif;
    font-size: 36px;
    line-height: 2;
    color: #e8cf8f;
    writing-mode: vertical-rl;
    -webkit-writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 12px;
    text-shadow: 0 0 30px rgba(232, 207, 143, 0.4);
  }

  .poem-author {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    color: #8a7a5c;
    margin-top: 24px;
    letter-spacing: 4px;
    text-align: right;
  }

  /* 场景信息 */
  .scene-info {
    top: 50%;
    left: 80px;
    transform: translateY(-50%);
    max-width: 220px;
    opacity: 0;
    transition: opacity 1.5s ease, transform 1.5s ease;
    transform: translateY(-50%) translateX(-30px);
  }

  .scene-info.show {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  .info-label {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 12px;
    color: #8a7a5c;
    letter-spacing: 4px;
    margin-bottom: 12px;
    border-left: 3px solid #d4af6a;
    padding-left: 14px;
  }

  .info-title {
    font-family: 'Ma Shan Zheng', 'STKaiti', serif;
    font-size: 32px;
    color: #f4d77e;
    letter-spacing: 6px;
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .info-desc {
    font-size: 14px;
    color: #a89673;
    line-height: 2;
    margin-top: 20px;
    letter-spacing: 1px;
  }

  /* 交互提示 */
  .hint {
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 11px;
    color: #5a4c2e;
    letter-spacing: 4px;
    text-align: center;
    animation: fadeHint 3s ease-in-out infinite;
    white-space: nowrap;
  }

  @keyframes fadeHint {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }

  /* 进入场景按钮 */
  .enter-btn {
    position: fixed;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    color: #d4af6a;
    background: rgba(15, 10, 5, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(212, 175, 106, 0.3);
    padding: 12px 28px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 4px;
    transition: all 0.4s ease;
    opacity: 0;
    pointer-events: none;
    animation: fadeInUp 1s ease 1.5s forwards;
  }

  .enter-btn:hover {
    background: rgba(212, 175, 106, 0.2);
    border-color: #d4af6a;
    transform: translateX(-50%) scale(1.05);
    box-shadow: 0 0 30px rgba(212, 175, 106, 0.3);
  }

  .enter-btn.hidden {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* 装饰角标 */
  .corner {
    position: fixed;
    width: 50px;
    height: 50px;
    border: 1px solid rgba(212, 175, 106, 0.3);
    z-index: 10;
    pointer-events: none;
  }

  .corner.tl { top: 25px; left: 25px; border-right: none; border-bottom: none; }
  .corner.tr { top: 25px; right: 25px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 25px; left: 25px; border-right: none; border-top: none; }
  .corner.br { bottom: 25px; right: 25px; border-left: none; border-top: none; }

  /* 进度条 */
  .progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d4af6a, transparent);
    z-index: 10;
    pointer-events: none;
    transition: width 0.3s ease;
  }

  /* 氛围效果层 */
  .ambience-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
  }

  /* 加载指示器 */
  .loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 100;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 14px;
    color: #d4af6a;
    letter-spacing: 4px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* 沉浸模式 */
  .immersive-mode .title-section,
  .immersive-mode .scene-panel,
  .immersive-mode .hint,
  .immersive-mode .scene-info,
  .immersive-mode .poem-display,
  .immersive-mode .corner {
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .immersive-mode:hover .title-section,
  .immersive-mode:hover .scene-panel,
  .immersive-mode:hover .hint,
  .immersive-mode:hover .scene-info,
  .immersive-mode:hover .poem-display,
  .immersive-mode:hover .corner {
    opacity: 1;
  }

  /* 响应式 */
  @media (max-width: 768px) {
    .main-title { font-size: 32px; letter-spacing: 6px; }
    .sub-title { font-size: 11px; letter-spacing: 3px; }
    .scene-panel { padding: 6px 10px; gap: 3px; bottom: 30px; }
    .scene-btn { font-size: 12px; padding: 8px 12px; letter-spacing: 1px; }
    .poem-display { right: 20px; max-width: 100px; }
    .poem-text { font-size: 24px; letter-spacing: 6px; }
    .scene-info { left: 20px; max-width: 140px; }
    .info-title { font-size: 22px; }
    .info-desc { font-size: 11px; }
    .hint { bottom: 120px; font-size: 10px; }
    .enter-btn { bottom: 160px; font-size: 12px; padding: 10px 22px; }
    .corner { width: 30px; height: 30px; }
    .original-painting { max-width: 85%; max-height: 50%; }
  }
</style>
</head>
<body class="immersive-mode">
<div class="loading" id="loading">粒 子 聚 集 中 · · ·</div>

<!-- 背景画布 - 氛围效果 -->
<canvas id="bgCanvas"></canvas>

<!-- 主画布 - 粒子系统 -->
<canvas id="canvas"></canvas>

<!-- 原画展示层 (保留元素，用于未来扩展) -->

<!-- 氛围效果层 -->
<div class="ambience-layer" id="ambienceLayer"></div>

<!-- 装饰角标 -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- 标题 -->
<div class="overlay title-section">
  <div class="main-title">星河粒子</div>
  <div class="sub-title">中 国 意 境 沉 浸 展</div>
</div>

<!-- 场景信息 -->
<div class="overlay scene-info" id="sceneInfo">
  <div class="info-label" id="infoLabel">· 古 画 ·</div>
  <div class="info-title" id="infoTitle">千里江山图</div>
  <div class="info-desc" id="infoDesc">王希孟以千里江山写尽少年意气，青绿山水间，是整个大宋的风华。</div>
</div>

<!-- 诗句展示 -->
<div class="overlay poem-display" id="poemDisplay">
  <div class="poem-text" id="poemText"></div>

</div>

<!-- 进入场景按钮 -->
<button class="enter-btn" id="enterBtn">⟡ 享 受 生 活 ⟡</button>

<!-- 场景选择 -->
<div class="overlay scene-panel">
  <button class="scene-btn active" data-scene="mountains">音 乐</button>
  <button class="scene-btn" data-scene="poetry">影 视</button>
  <button class="scene-btn" data-scene="opera">咖 啡</button>
  <button class="scene-btn" data-scene="garden">旅 行</button>

</div>

<!-- 交互提示 -->
<div class="overlay hint">⟡ 滚轮缩放 · 双击沉浸 · 拖拽漫游 · 让粒子为你的生活喝彩 ⟡</div>

<!-- 辅助画布 -->
<canvas id="shapeCanvas" style="display:none;"></canvas>

<script>
// ==================== 全局变量 ====================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const shapeCanvas = document.getElementById('shapeCanvas');
const shapeCtx = shapeCanvas.getContext('2d', { willReadFrequently: true });

let W, H;
let particles = [];
let ambientParticles = []; // 氛围粒子
let floatingElements = []; // 飘浮元素
let mouseX = 0, mouseY = 0;
let isMouseMoving = false;
let mouseTimeout;
let currentScene = 'mountains';
let isImmersive = false;
let isPaintingVisible = true;
let paintingRevealProgress = 0;
let sceneTransitionProgress = 0;
let isTransitioning = false;
let time = 0;
let zoom = 1;
let panX = 0, panY = 0;
let isDragging = false;
let lastMouseX, lastMouseY;

// ==================== 场景配置 ====================
const scenes = {
  mountains: {
    label: '· 音 乐 ·',
    title: '音乐时光',
    desc: '旋律在耳边流转，节拍与心跳共鸣。每一次按下播放键，都是与世界的温柔对话。',
    poem: '高山流水\n知音难觅',
    author: '— 古 曲',
    color: { main: '#c96a7e', accent: '#f4d77e', glow: '#6b2e3d', secondary: '#3a1a25' },
    type: 'music',
    painting: null,
    ambience: 'mist'
  },
  poetry: {
    label: '· 影 视 ·',
    title: '光影故事',
    desc: '银幕亮起，故事开启。每一部电影都是一段旅程，每一帧画面都藏着人生的某种真实。',
    poem: '人生如戏\n戏如人生',
    author: '— 汤显祖',
    color: { main: '#5a4c8b', accent: '#e8d8a8', glow: '#2e2a4a', secondary: '#1a1830' },
    type: 'movie',
    painting: null,
    ambience: 'fireflies'
  },
  opera: {
    label: '· 咖 啡 ·',
    title: '咖啡时光',
    desc: '一杯咖啡，一段慵懒的下午。香气在杯中升腾，时间在舌尖慢慢流淌。',
    poem: '偷得浮生\n半日闲',
    author: '— 李 涉',
    color: { main: '#8b4513', accent: '#d4af6a', glow: '#4a2810', secondary: '#2a1a08' },
    type: 'coffee',
    painting: null,
    ambience: 'petals'
  },
  garden: {
    label: '· 旅 行 ·',
    title: '环游世界',
    desc: '背上行囊，去看更远的地方。山海与星空，遇见不同的人和故事，遇见更好的自己。',
    poem: '世界那么大\n我想去看看',
    author: '— 顾少强',
    color: { main: '#4a8f6b', accent: '#f4d77e', glow: '#2d5a4a', secondary: '#1a3a2a' },
    type: 'travel',
    painting: null,
    ambience: 'leaves'
  },
  calligraphy: {
    label: '· 游 戏 ·',
    title: '游戏乐园',
    desc: '进入游戏世界，做自己的英雄。从简单的小游戏到史诗级冒险，这里有无限的可能。',
    poem: '玩物养志\n不负韶华',
    author: '— 古 语',
    color: { main: '#5a7ac9', accent: '#e8d8a8', glow: '#2e3f6b', secondary: '#1a1f3a' },
    type: 'game',
    painting: null,
    ambience: 'ink'
  },
  stars: {
    label: '· 运 动 ·',
    title: '运动激情',
    desc: '挥洒汗水，释放能量。每一次奔跑都是对生活的热爱，每一滴汗水都是青春的勋章。',
    poem: '生命不息\n运动不止',
    author: '— 奥 义',
    color: { main: '#d4af6a', accent: '#f4d77e', glow: '#4a3f2e', secondary: '#2a2520' },
    type: 'sport',
    painting: null,
    ambience: 'stars'
  }
};

// ==================== 粒子类 ====================
class Particle {
  constructor(x, y, tx, ty) {
    this.x = x;
    this.y = y;
    this.tx = tx;
    this.ty = ty;
    this.ox = x;
    this.oy = y;
    this.vx = (Math.random() - 0.5) * 1;
    this.vy = (Math.random() - 0.5) * 1;
    this.size = Math.random() * 2 + 0.5;
    this.baseSize = this.size;
    this.friction = 0.88 + Math.random() * 0.08;
    this.alpha = 0;
    this.targetAlpha = 0.5 + Math.random() * 0.5;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.008 + Math.random() * 0.015;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotationSpeed = (Math.random() - 0.5) * 0.02;
    this.trail = [];
    this.maxTrail = 5;
  }

  update(mouseDisturb, isMouseActive) {
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // 追踪目标
    if (dist > 0.5) {
      const force = dist * 0.015;
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force;
    }

    // 鼠标扰动
    if (mouseDisturb > 0 && isMouseActive) {
      const mdx = this.x - mouseX;
      const mdy = this.y - mouseY;
      const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mdist < 200 && mdist > 0) {
        const force = (200 - mdist) * 0.004;
        this.vx += (mdx / mdist) * force;
        this.vy += (mdy / mdist) * force;
        this.targetAlpha = 0.8 + Math.sin(time * 0.05) * 0.2;
      }
    }

    // 摆动效果
    this.wobble += this.wobbleSpeed;
    this.rotation += this.rotationSpeed;
    this.vx += Math.sin(this.wobble) * 0.02;
    this.vy += Math.cos(this.wobble * 0.7) * 0.02;

    // 阻力
    this.vx *= this.friction;
    this.vy *= this.friction;

    // 更新位置
    this.x += this.vx;
    this.y += this.vy;

    // 拖尾效果
    if (isMouseActive && dist < 50) {
      this.trail.unshift({ x: this.x, y: this.y, alpha: this.alpha });
      if (this.trail.length > this.maxTrail) {
        this.trail.pop();
      }
    }

    // 透明度
    if (dist < 30) {
      this.alpha += (this.targetAlpha - this.alpha) * 0.06;
    } else if (dist < 150) {
      this.alpha += ((this.targetAlpha * 0.6) - this.alpha) * 0.04;
    } else {
      this.alpha += (0.08 - this.alpha) * 0.03;
    }

    // 大小脉动
    this.size = this.baseSize * (0.7 + Math.sin(time * 0.015 + this.wobble) * 0.4);
  }

  draw(ctx, color) {
    const brightness = 0.9 + Math.sin(this.wobble + time * 0.02) * 0.3;

    // 绘制拖尾
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const trailAlpha = (1 - i / this.maxTrail) * 0.3 * this.alpha;
      ctx.globalAlpha = trailAlpha;
      ctx.fillStyle = color.accent;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha)) * brightness;

    // 外发光
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 5);
    grad.addColorStop(0, color.accent);
    grad.addColorStop(0.2, color.main);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 5, 0, Math.PI * 2);
    ctx.fill();

    // 核心
    ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha)) * brightness * 1.3;
    ctx.fillStyle = color.accent;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ==================== 氛围粒子类 ====================
class AmbientParticle {
  constructor(type) {
    this.type = type;
    this.reset();
  }

  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.5;
    this.vy = (Math.random() - 0.5) * 0.5;
    this.size = Math.random() * 3 + 1;
    this.alpha = Math.random() * 0.5 + 0.2;
    this.life = 0;
    this.maxLife = 300 + Math.random() * 200;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.01 + Math.random() * 0.02;
  }

  update(sceneColor) {
    this.life++;
    this.wobble += this.wobbleSpeed;

    if (this.type === 'fireflies') {
      this.vx += Math.sin(this.wobble) * 0.02;
      this.vy += Math.cos(this.wobble * 0.8) * 0.02;
      this.alpha = 0.3 + Math.sin(time * 0.05 + this.wobble) * 0.3;
    } else if (this.type === 'mist') {
      this.vy -= 0.1;
      this.alpha = 0.1 + Math.sin(this.wobble) * 0.05;
    } else if (this.type === 'stars') {
      this.alpha = 0.5 + Math.sin(time * 0.03 + this.wobble) * 0.5;
    } else {
      this.vx += (Math.random() - 0.5) * 0.1;
      this.vy += (Math.random() - 0.5) * 0.1;
    }

    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.99;
    this.vy *= 0.99;

    if (this.life > this.maxLife || this.x < 0 || this.x > W || this.y < 0 || this.y > H) {
      this.reset();
    }
  }

  draw(ctx, color) {
    ctx.globalAlpha = this.alpha;

    if (this.type === 'fireflies') {
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 8);
      grad.addColorStop(0, '#ffffaa');
      grad.addColorStop(0.3, color.accent);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 8, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'mist') {
      ctx.fillStyle = `rgba(200, 200, 200, ${this.alpha})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 10, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'stars') {
      ctx.fillStyle = color.accent;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = color.accent;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ==================== 飘浮元素类 ====================
class FloatingElement {
  constructor(type) {
    this.type = type;
    this.reset();
  }

  reset() {
    if (this.type === 'petal') {
      this.x = Math.random() * W;
      this.y = -50;
      this.size = 8 + Math.random() * 12;
      this.vx = (Math.random() - 0.5) * 1;
      this.vy = Math.random() * 1 + 0.5;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.05;
      this.color = ['#ffb6c1', '#ffc0cb', '#ff69b4', '#ff1493'][Math.floor(Math.random() * 4)];
    } else if (this.type === 'leaf') {
      this.x = Math.random() * W;
      this.y = -50;
      this.size = 10 + Math.random() * 15;
      this.vx = (Math.random() - 0.5) * 0.5;
      this.vy = Math.random() * 0.8 + 0.3;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.03;
      this.color = ['#6b8e6b', '#8fbc8f', '#9acd32', '#556b2f'][Math.floor(Math.random() * 4)];
    } else if (this.type === 'ink') {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.size = 2 + Math.random() * 4;
      this.vx = 0;
      this.vy = -0.2 - Math.random() * 0.3;
      this.alpha = 0.3 + Math.random() * 0.4;
    }

    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.02 + Math.random() * 0.02;
  }

  update() {
    this.wobble += this.wobbleSpeed;

    if (this.type === 'petal' || this.type === 'leaf') {
      this.x += this.vx + Math.sin(this.wobble) * 0.5;
      this.y += this.vy;
      this.rotation += this.rotationSpeed + Math.sin(this.wobble) * 0.01;
      if (this.y > H + 50) this.reset();
    } else if (this.type === 'ink') {
      this.y += this.vy;
      this.x += Math.sin(this.wobble) * 0.3;
      this.alpha -= 0.001;
      if (this.alpha <= 0 || this.y < -20) this.reset();
    }
  }

  draw(ctx) {
    if (this.type === 'petal') {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (this.type === 'leaf') {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.moveTo(0, -this.size);
      ctx.quadraticCurveTo(this.size * 0.8, 0, 0, this.size);
      ctx.quadraticCurveTo(-this.size * 0.8, 0, 0, -this.size);
      ctx.fill();
      ctx.restore();
    } else if (this.type === 'ink') {
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ==================== 初始化 ====================
function resize() {
  W = canvas.width = bgCanvas.width = window.innerWidth;
  H = canvas.height = bgCanvas.height = window.innerHeight;
  initParticles();
  initAmbience();
  generateTargetPositions();
}

window.addEventListener('resize', resize);

function initParticles() {
  particles = [];
  const count = Math.min(8000, Math.floor((W * H) / 400));
  for (let i = 0; i < count; i++) {
    const p = new Particle(
      Math.random() * W,
      Math.random() * H,
      Math.random() * W,
      Math.random() * H
    );
    particles.push(p);
  }
}

function initAmbience() {
  const scene = scenes[currentScene];
  const ambienceType = scene.ambience;

  ambientParticles = [];
  floatingElements = [];

  const ambientCount = 150;
  for (let i = 0; i < ambientCount; i++) {
    ambientParticles.push(new AmbientParticle(ambienceType));
  }

  const floatCount = 30;
  if (ambienceType === 'petals') {
    for (let i = 0; i < floatCount; i++) {
      floatingElements.push(new FloatingElement('petal'));
    }
  } else if (ambienceType === 'leaves') {
    for (let i = 0; i < floatCount; i++) {
      floatingElements.push(new FloatingElement('leaf'));
    }
  } else if (ambienceType === 'ink') {
    for (let i = 0; i < floatCount * 2; i++) {
      floatingElements.push(new FloatingElement('ink'));
    }
  }
}

// ==================== 形状生成 ====================
function generateShapePoints(type, count) {
  const points = [];
  const cx = W / 2 + panX;
  const cy = H / 2 + panY;
  const scale = Math.min(W, H) * 0.4 * zoom;

  if (type === 'music') {
    // 音乐 - 音符与声波
    // 大五线谱
    const staffLines = 5;
    const staffWidth = scale * 2.5;
    const staffLeft = cx - staffWidth / 2;
    const staffY = cy;
    const lineSpacing = scale * 0.1;

    for (let l = 0; l < staffLines; l++) {
      for (let i = 0; i < count * 0.1; i++) {
        points.push({
          x: staffLeft + Math.random() * staffWidth + panX,
          y: staffY - lineSpacing * 2 + l * lineSpacing + (Math.random() - 0.5) * 3 + panY
        });
      }
    }

    // 音符 - 大圆点带尾巴
    const noteCount = 7;
    for (let n = 0; n < noteCount; n++) {
      const noteX = staffLeft + (n + 0.5) * (staffWidth / noteCount);
      const noteY = staffY + (Math.sin(n * 1.5) - 0.5) * lineSpacing * 2;
      const noteSize = scale * 0.08 + Math.random() * scale * 0.04;

      // 圆头
      for (let i = 0; i < count * 0.04; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = noteSize * (0.7 + Math.random() * 0.3);
        points.push({
          x: noteX + Math.cos(angle) * r + panX,
          y: noteY + Math.sin(angle) * r * 0.8 + panY
        });
      }

      // 竖线
      for (let i = 0; i < count * 0.02; i++) {
        const y = noteY - scale * 0.3 - Math.random() * scale * 0.05;
        points.push({
          x: noteX + (Math.random() - 0.5) * 3 + panX,
          y: y + panY
        });
      }

      // 尾巴旗
      for (let i = 0; i < count * 0.02; i++) {
        const flagY = noteY - scale * 0.3 + Math.random() * scale * 0.15;
        const flagX = noteX + scale * 0.05 + Math.random() * scale * 0.1;
        points.push({
          x: flagX + panX,
          y: flagY + panY
        });
      }
    }

    // 声波 - 圆形波纹
    const waveCount = 3;
    for (let w = 0; w < waveCount; w++) {
      const waveR = scale * (0.4 + w * 0.3);
      for (let i = 0; i < count * 0.05; i++) {
        const angle = Math.random() * Math.PI * 2 + time * 0.001 * (w + 1);
        const r = waveR * (0.95 + Math.random() * 0.1);
        points.push({
          x: cx + Math.cos(angle) * r + panX,
          y: cy + Math.sin(angle) * r + panY
        });
      }
    }

    // 散落的音符粒子
    for (let i = 0; i < count * 0.15; i++) {
      points.push({
        x: Math.random() * W + panX,
        y: Math.random() * H + panY
      });
    }

  } else if (type === 'movie') {
    // 影视 - 电影胶片
    // 胶片主体
    const filmWidth = scale * 2.2;
    const filmHeight = scale * 1.4;
    const filmLeft = cx - filmWidth / 2;
    const filmTop = cy - filmHeight / 2;

    // 胶片框
    for (let i = 0; i < count * 0.05; i++) {
      // 上边缘
      points.push({
        x: filmLeft + Math.random() * filmWidth + panX,
        y: filmTop + (Math.random() - 0.5) * 3 + panY
      });
      // 下边缘
      points.push({
        x: filmLeft + Math.random() * filmWidth + panX,
        y: filmTop + filmHeight + (Math.random() - 0.5) * 3 + panY
      });
      // 左边缘
      points.push({
        x: filmLeft + (Math.random() - 0.5) * 3 + panX,
        y: filmTop + Math.random() * filmHeight + panY
      });
      // 右边缘
      points.push({
        x: filmLeft + filmWidth + (Math.random() - 0.5) * 3 + panX,
        y: filmTop + Math.random() * filmHeight + panY
      });
    }

    // 上下排齿孔
    const holeCount = 8;
    for (let h = 0; h < holeCount; h++) {
      const holeX = filmLeft + (h + 0.5) * (filmWidth / holeCount);
      // 上排
      for (let i = 0; i < count * 0.01; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = scale * 0.04 * (0.7 + Math.random() * 0.3);
        points.push({
          x: holeX + Math.cos(angle) * r + panX,
          y: filmTop + scale * 0.1 + Math.sin(angle) * r * 0.6 + panY
        });
      }
      // 下排
      for (let i = 0; i < count * 0.01; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = scale * 0.04 * (0.7 + Math.random() * 0.3);
        points.push({
          x: holeX + Math.cos(angle) * r + panX,
          y: filmTop + filmHeight - scale * 0.1 + Math.sin(angle) * r * 0.6 + panY
        });
      }
    }

    // 中间画面 - 中心人物剪影
    const pictureLeft = filmLeft + scale * 0.15;
    const pictureTop = filmTop + scale * 0.25;
    const pictureWidth = filmWidth - scale * 0.3;
    const pictureHeight = filmHeight - scale * 0.5;

    // 背景画面
    for (let i = 0; i < count * 0.2; i++) {
      points.push({
        x: pictureLeft + Math.random() * pictureWidth + panX,
        y: pictureTop + Math.random() * pictureHeight + panY
      });
    }

    // 中心人物剪影
    const figureCX = cx;
    const figureCY = cy;
    // 头
    for (let i = 0; i < count * 0.04; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = scale * 0.12 * (0.7 + Math.random() * 0.3);
      points.push({
        x: figureCX + Math.cos(angle) * r + panX,
        y: figureCY - scale * 0.25 + Math.sin(angle) * r * 0.9 + panY
      });
    }
    // 身体
    for (let i = 0; i < count * 0.1; i++) {
      const t = Math.random();
      points.push({
        x: figureCX + (Math.random() - 0.5) * scale * 0.4 + panX,
        y: figureCY - scale * 0.1 + t * scale * 0.5 + panY
      });
    }

    // 播放按钮三角形
    const playSize = scale * 0.15;
    for (let i = 0; i < count * 0.03; i++) {
      const t = Math.random();
      const s = Math.random();
      if (s + t * 0.5 < 0.5) {
        points.push({
          x: cx + playSize * (t - 0.5) + panX,
          y: cy + playSize * (Math.random() - 0.5) + panY
        });
      }
    }

    // 周围浮动的小星
    for (let i = 0; i < count * 0.1; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = scale * (1.2 + Math.random() * 0.3);
      points.push({
        x: cx + Math.cos(angle) * r + panX,
        y: cy + Math.sin(angle) * r + panY
      });
    }

  } else if (type === 'coffee') {
    // 咖啡 - 杯与热气
    // 咖啡杯主体
    const cupW = scale * 0.7;
    const cupH = scale * 0.5;
    const cupTop = cy - scale * 0.2;
    const cupBottom = cy + cupH;
    const cupLeft = cx - cupW / 2;
    const cupRight = cx + cupW / 2;

    // 杯身
    for (let i = 0; i < count * 0.15; i++) {
      // 杯壁 - 梯形
      const t = Math.random();
      const cupHalfWidth = cupW / 2 * (1 - t * 0.1);
      const side = Math.random() > 0.5 ? 1 : -1;
      const x = cx + side * cupHalfWidth * (0.9 + Math.random() * 0.2);
      const y = cupTop + t * cupH + (Math.random() - 0.5) * 4;
      points.push({ x, y });
    }

    // 杯底
    for (let i = 0; i < count * 0.04; i++) {
      points.push({
        x: cupLeft + scale * 0.1 + Math.random() * (cupW - scale * 0.2) + panX,
        y: cupBottom + (Math.random() - 0.5) * 5 + panY
      });
    }

    // 咖啡液面
    for (let i = 0; i < count * 0.08; i++) {
      const ellipseT = Math.random() * Math.PI * 2;
      const ellipseR = cupW / 2 * 0.95;
      points.push({
        x: cx + Math.cos(ellipseT) * ellipseR + panX,
        y: cupTop + Math.sin(ellipseT) * ellipseR * 0.3 + panY
      });
    }

    // 把手
    for (let i = 0; i < count * 0.04; i++) {
      const angle = Math.random() * Math.PI;
      const r = scale * 0.15 * (0.8 + Math.random() * 0.2);
      points.push({
        x: cupRight + Math.cos(angle) * r * 0.5 + panX,
        y: cy + Math.sin(angle) * r + panY
      });
    }

    // 杯盖
    for (let i = 0; i < count * 0.03; i++) {
      const lidT = Math.random() * Math.PI * 2;
      const lidR = cupW / 2 * 1.1;
      points.push({
        x: cx + Math.cos(lidT) * lidR + panX,
        y: cupTop - scale * 0.04 + Math.sin(lidT) * lidR * 0.2 + panY
      });
    }

    // 热气 - 飘动的曲线
    const steamCount = 3;
    for (let s = 0; s < steamCount; s++) {
      const steamOffset = (s - 1) * scale * 0.15;
      for (let i = 0; i < count * 0.05; i++) {
        const t = Math.random();
        const waveX = Math.sin(t * Math.PI * 2 - time * 0.005 + s) * scale * 0.08;
        const x = cx + steamOffset + waveX;
        const y = cupTop - scale * 0.1 - t * scale * 0.6;
        points.push({ x: x + panX, y: y + panY });
      }
    }

    // 周围小咖啡豆
    for (let i = 0; i < count * 0.08; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = scale * (1.0 + Math.random() * 0.3);
      const beanSize = scale * 0.05;
      for (let j = 0; j < 3; j++) {
        const a = Math.random() * Math.PI * 2;
        points.push({
          x: cx + Math.cos(angle) * r + Math.cos(a) * beanSize + panX,
          y: cy + Math.sin(angle) * r + Math.sin(a) * beanSize + panY
        });
      }
    }

  } else if (type === 'travel') {
    // 旅行 - 地球与飞机
    // 地球
    const earthR = scale * 0.6;
    for (let i = 0; i < count * 0.25; i++) {
      const angle = Math.random() * Math.PI * 2;
      const lat = (Math.random() - 0.5) * Math.PI;
      const r = earthR * (0.95 + Math.random() * 0.05);
      points.push({
        x: cx + Math.cos(angle) * r * Math.cos(lat) + panX,
        y: cy + Math.sin(lat) * r * 0.5 + panY
      });
    }

    // 大陆 - 不规则斑块
    for (let i = 0; i < count * 0.15; i++) {
      const baseAngle = Math.random() * Math.PI * 2;
      const baseR = earthR * (0.5 + Math.random() * 0.4);
      for (let j = 0; j < 5; j++) {
        const a = baseAngle + (Math.random() - 0.5) * 0.4;
        const r = baseR + Math.random() * earthR * 0.2;
        points.push({
          x: cx + Math.cos(a) * r + panX,
          y: cy + Math.sin(a) * r * 0.5 + panY
        });
      }
    }

    // 经线
    for (let lon = 0; lon < 8; lon++) {
      const lonAngle = (lon / 8) * Math.PI * 2;
      for (let i = 0; i < count * 0.02; i++) {
        const lat = (i / (count * 0.02) - 0.5) * Math.PI;
        points.push({
          x: cx + Math.cos(lonAngle) * earthR * Math.cos(lat) * (0.95 + Math.random() * 0.05) + panX,
          y: cy + Math.sin(lat) * earthR * 0.5 + panY
        });
      }
    }

    // 飞机飞行轨迹
    for (let i = 0; i < count * 0.08; i++) {
      const t = Math.random();
      const angle = t * Math.PI * 2 + time * 0.002;
      const r = scale * (0.7 + Math.sin(t * Math.PI * 2) * 0.15);
      points.push({
        x: cx + Math.cos(angle) * r + (Math.random() - 0.5) * 8 + panX,
        y: cy + Math.sin(angle) * r * 0.5 + (Math.random() - 0.5) * 8 + panY
      });
    }

    // 飞机标记点
    for (let i = 0; i < count * 0.02; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = scale * (0.7 + Math.random() * 0.3);
      points.push({
        x: cx + Math.cos(angle) * r + panX,
        y: cy + Math.sin(angle) * r * 0.5 + panY
      });
    }

    // 围绕的小星星
    for (let i = 0; i < count * 0.15; i++) {
      points.push({
        x: Math.random() * W + panX,
        y: Math.random() * H * 0.8 + panY
      });
    }

  } else if (type === 'game') {
    // 游戏 - 手柄与像素
    // 手柄主体
    const gamepadW = scale * 1.4;
    const gamepadH = scale * 0.7;
    const gamepadLeft = cx - gamepadW / 2;
    const gamepadTop = cy - gamepadH / 2;

    // 手柄外轮廓
    for (let i = 0; i < count * 0.2; i++) {
      const t = Math.random() * Math.PI * 2;
      const isLeft = Math.cos(t) < 0;
      const baseR = (isLeft ? gamepadW * 0.25 : gamepadW * 0.3);
      const r = baseR * (0.8 + Math.random() * 0.2);
      points.push({
        x: (isLeft ? gamepadLeft : gamepadLeft + gamepadW) + Math.cos(t) * r + panX,
        y: cy + Math.sin(t) * r * 0.7 + panY
      });
    }

    // 顶部连接
    for (let i = 0; i < count * 0.05; i++) {
      points.push({
        x: gamepadLeft + gamepadW * 0.2 + Math.random() * gamepadW * 0.6 + panX,
        y: gamepadTop + (Math.random() - 0.5) * 4 + panY
      });
    }

    // 方向键 - 十字
    for (let i = 0; i < count * 0.05; i++) {
      const dir = Math.floor(Math.random() * 4);
      const keyR = scale * 0.12;
      if (dir === 0) { points.push({ x: gamepadLeft + keyR + (Math.random() - 0.5) * 4 + panX, y: cy + (Math.random() - 0.5) * 4 + panY }); }
      else if (dir === 1) { points.push({ x: gamepadLeft + (Math.random() - 0.5) * 4 + panX, y: cy - keyR + (Math.random() - 0.5) * 4 + panY }); }
      else if (dir === 2) { points.push({ x: gamepadLeft + (Math.random() - 0.5) * 4 + panX, y: cy + keyR + (Math.random() - 0.5) * 4 + panY }); }
      else { points.push({ x: gamepadLeft + keyR + (Math.random() - 0.5) * 4 + panX, y: cy + keyR + (Math.random() - 0.5) * 4 + panY }); }
    }

    // 按钮 - 4个圆形
    const buttons = [
      { x: gamepadLeft + gamepadW * 0.75, y: cy - scale * 0.1 },
      { x: gamepadLeft + gamepadW * 0.8, y: cy + scale * 0.05 },
      { x: gamepadLeft + gamepadW * 0.7, y: cy + scale * 0.05 },
      { x: gamepadLeft + gamepadW * 0.75, y: cy + scale * 0.15 }
    ];
    for (const btn of buttons) {
      for (let i = 0; i < count * 0.02; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = scale * 0.06 * (0.7 + Math.random() * 0.3);
        points.push({
          x: btn.x + Math.cos(angle) * r + panX,
          y: btn.y + Math.sin(angle) * r + panY
        });
      }
    }

    // 摇杆
    const stickPositions = [
      { x: gamepadLeft + gamepadW * 0.25, y: cy + scale * 0.05 },
      { x: gamepadLeft + gamepadW * 0.55, y: cy - scale * 0.1 }
    ];
    for (const stick of stickPositions) {
      for (let i = 0; i < count * 0.03; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = scale * 0.08 * (0.7 + Math.random() * 0.3);
        points.push({
          x: stick.x + Math.cos(angle) * r + panX,
          y: stick.y + Math.sin(angle) * r + panY
        });
      }
    }

    // 像素粒子
    for (let i = 0; i < count * 0.15; i++) {
      const px = Math.floor(Math.random() * 20);
      const py = Math.floor(Math.random() * 12);
      points.push({
        x: Math.random() * W * 0.9 + W * 0.05 + panX,
        y: H * 0.85 + py * 3 + panY
      });
    }

    // 周围浮动粒子
    for (let i = 0; i < count * 0.1; i++) {
      points.push({
        x: Math.random() * W + panX,
        y: Math.random() * H * 0.4 + panY
      });
    }

  } else if (type === 'sport') {
    // 运动 - 篮球与球网
    // 篮球主体
    const ballR = scale * 0.4;
    for (let i = 0; i < count * 0.25; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = ballR * (0.95 + Math.random() * 0.05);
      points.push({
        x: cx + Math.cos(angle) * r + panX,
        y: cy + Math.sin(angle) * r + panY
      });
    }

    // 篮球纹路
    for (let i = 0; i < count * 0.1; i++) {
      // 水平纹路
      points.push({
        x: cx + (Math.random() - 0.5) * ballR * 2 * 0.95 + panX,
        y: cy + (Math.random() - 0.5) * 4 + panY
      });
      // 垂直纹路
      points.push({
        x: cx + (Math.random() - 0.5) * 4 + panX,
        y: cy + (Math.random() - 0.5) * ballR * 2 * 0.95 + panY
      });
      // 弧线
      const t = Math.random();
      const curveAngle = Math.PI * 0.5 + t * Math.PI;
      points.push({
        x: cx + Math.cos(curveAngle) * ballR * 0.7 * (0.8 + Math.random() * 0.2) + panX,
        y: cy + Math.sin(curveAngle) * ballR * 0.4 + panY
      });
    }

    // 运动轨迹 - 抛物线
    for (let i = 0; i < count * 0.15; i++) {
      const t = Math.random();
      const x = cx + (t - 0.5) * scale * 1.5;
      const y = cy - t * scale * 0.8 + scale * 0.4 + Math.sin(t * Math.PI) * scale * 0.3;
      points.push({
        x: x + (Math.random() - 0.5) * 8 + panX,
        y: y + (Math.random() - 0.5) * 8 + panY
      });
    }

    // 球网 - 网格点
    const netW = scale * 1.2;
    const netLeft = cx - netW / 2;
    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 12; col++) {
        const nx = netLeft + col * (netW / 12);
        const ny = cy + scale * 0.4 + row * (scale * 0.08);
        if (Math.random() > 0.4) {
          for (let i = 0; i < count * 0.005; i++) {
            points.push({
              x: nx + (Math.random() - 0.5) * 4 + panX,
              y: ny + (Math.random() - 0.5) * 4 + panY
            });
          }
        }
      }
    }

    // 速度线
    for (let i = 0; i < count * 0.1; i++) {
      const y = H * 0.2 + Math.random() * H * 0.6;
      points.push({
        x: Math.random() * W + panX,
        y: y + panY
      });
    }
  }

  return points;
}

function generateTargetPositions() {
  const scene = scenes[currentScene];
  const count = particles.length;
  const points = generateShapePoints(scene.type, count);

  for (let i = 0; i < particles.length; i++) {
    if (points.length > 0) {
      const pt = points[i % points.length];
      particles[i].tx = pt.x;
      particles[i].ty = pt.y;
    }
  }
}

// ==================== 绘制函数 ====================
function drawBackgroundGlow() {
  const scene = scenes[currentScene];
  bgCtx.globalAlpha = 1;

  // 渐变背景
  const gradient = bgCtx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.8);
  gradient.addColorStop(0, scene.color.glow + '50');
  gradient.addColorStop(0.4, scene.color.secondary + '40');
  gradient.addColorStop(0.7, scene.color.glow + '20');
  gradient.addColorStop(1, '#000000');
  bgCtx.fillStyle = gradient;
  bgCtx.fillRect(0, 0, W, H);

  // 动态光晕
  bgCtx.globalAlpha = 0.06;
  for (let i = 0; i < 20; i++) {
    const x = (Math.sin(time * 0.0008 + i) * 0.4 + 0.5) * W;
    const y = (Math.cos(time * 0.001 + i * 2) * 0.4 + 0.5) * H;
    const r = 80 + Math.sin(time * 0.002 + i) * 40;
    const g = bgCtx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, scene.color.accent);
    g.addColorStop(1, 'transparent');
    bgCtx.fillStyle = g;
    bgCtx.beginPath();
    bgCtx.arc(x, y, r, 0, Math.PI * 2);
    bgCtx.fill();
  }
}

function drawAmbience() {
  const scene = scenes[currentScene];

  for (const p of ambientParticles) {
    p.update(scene.color);
    p.draw(ctx, scene.color);
  }

  for (const f of floatingElements) {
    f.update();
    f.draw(ctx);
  }
}

function animate() {
  time++;

  ctx.clearRect(0, 0, W, H);
  bgCtx.clearRect(0, 0, W, H);

  drawBackgroundGlow();

  const scene = scenes[currentScene];

  for (let i = 0; i < particles.length; i++) {
    particles[i].update(1, isMouseMoving);
    particles[i].draw(ctx, scene.color);
  }

  drawAmbience();

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

// ==================== 交互 ====================
canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  isMouseMoving = true;

  clearTimeout(mouseTimeout);
  mouseTimeout = setTimeout(() => {
    isMouseMoving = false;
  }, 100);

  if (isDragging) {
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    panX += dx;
    panY += dy;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    generateTargetPositions();
  }
});

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('mouseup', () => {
  isDragging = false;
  canvas.style.cursor = 'crosshair';
});

canvas.addEventListener('mouseleave', () => {
  isDragging = false;
  canvas.style.cursor = 'crosshair';
});

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    mouseX = e.touches[0].clientX;
    mouseY = e.touches[0].clientY;
    isMouseMoving = true;
  }
});

canvas.addEventListener('click', (e) => {
  const sceneKeys = Object.keys(scenes);
  const idx = sceneKeys.indexOf(currentScene);
  const nextIdx = (idx + 1) % sceneKeys.length;
  switchScene(sceneKeys[nextIdx]);
});

canvas.addEventListener('dblclick', (e) => {
  enterImmersive();
});

// 滚轮缩放
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.95 : 1.05;
  zoom = Math.max(0.5, Math.min(2, zoom * delta));
  generateTargetPositions();
});

// 场景切换
document.querySelectorAll('.scene-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const sceneKey = btn.dataset.scene;
    switchScene(sceneKey);
  });
});

function switchScene(sceneKey) {
  if (currentScene === sceneKey) return;
  currentScene = sceneKey;

  document.querySelectorAll('.scene-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.scene === sceneKey);
  });

  const scene = scenes[sceneKey];

  // 更新信息
  const infoEl = document.getElementById('sceneInfo');
  const poemEl = document.getElementById('poemDisplay');

  infoEl.classList.remove('show');
  poemEl.classList.remove('show');

  setTimeout(() => {
    document.getElementById('infoLabel').textContent = scene.label;
    document.getElementById('infoTitle').textContent = scene.title;
    document.getElementById('infoDesc').textContent = scene.desc;
    document.getElementById('poemText').textContent = scene.poem;
    document.getElementById('poemAuthor').textContent = scene.author;
    infoEl.classList.add('show');
    poemEl.classList.add('show');
  }, 600);

  // 重置视角
  zoom = 1;
  panX = 0;
  panY = 0;

  // 重新初始化氛围
  initAmbience();
  generateTargetPositions();

  // 散开粒子
  for (let i = 0; i < particles.length; i++) {
    const dx = particles[i].tx - particles[i].x;
    const dy = particles[i].ty - particles[i].y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 50) {
      particles[i].x = Math.random() * W;
      particles[i].y = Math.random() * H;
    }
  }
}

function enterImmersive() {
  isImmersive = !isImmersive;
  const btn = document.getElementById('enterBtn');

  if (isImmersive) {
    document.body.classList.add('immersive-mode');
    btn.textContent = '⟡ 退 出 沉 浸 ⟡';
  } else {
    document.body.classList.remove('immersive-mode');
    btn.textContent = '⟡ 享 受 生 活 ⟡';
  }
}

document.getElementById('enterBtn').addEventListener('click', enterImmersive);

// ==================== 启动 ====================
resize();

setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('sceneInfo').classList.add('show');
  document.getElementById('poemDisplay').classList.add('show');
}, 1500);

animate();
</script>
